<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Portal - Admin Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            padding: 15px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #1f293d;
            padding-bottom: 15px;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #38bdf8;
        }

        .back-btn {
            background: #2563eb;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
        }

        .tabs-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 5px;
        }

        .tab-btn {
            background: #121824;
            color: #9ca3af;
            border: 1px solid #1f293d;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            flex-shrink: 0;
        }

            .tab-btn.active {
                background: #2563eb;
                color: white;
                border-color: #2563eb;
            }

        .global-table-scroll-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-bottom: 20px;
        }

        .campaign-card {
            background: #0b0f17;
            margin-bottom: 20px;
            border-radius: 8px;
            width: 100%;
            min-width: 900px;
            border: 1px solid #1f293d;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid #1f293d;
            font-size: 13px;
            white-space: nowrap;
        }

        th {
            background: #121824;
            color: #f59e0b;
            font-weight: bold;
        }

        .status-approved {
            color: #10B981;
            font-weight: bold;
        }

        .status-pending {
            color: #f59e0b;
            font-weight: bold;
        }

        .status-rejected {
            color: #ef4444;
            font-weight: bold;
        }

        .btn-action {
            padding: 6px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
            margin-right: 4px;
        }

        .btn-approve {
            background: #10B981;
            color: white;
        }

        .btn-reject {
            background: #f59e0b;
            color: white;
        }

        .btn-delete {
            background: #ef4444;
            color: white;
        }

        .btn-preview {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
        }

        .media-link {
            color: #38bdf8;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="header">
        <div class="logo">🛠️ Secure Management Dashboard</div>
        <a href="index.html" class="back-btn">← Go to Website</a>
    </div>

    <div class="tabs-container">
        <button class="tab-btn active" id="pendingTabBtn" onclick="switchTab('pending')">Pending Requests ⏳</button>
        <button class="tab-btn" id="campaignsTabBtn" onclick="switchTab('campaigns')">Campaign Details ✅</button>
    </div>

    <div class="global-table-scroll-wrapper">
        <div id="tableContainer">
            <!-- Dynamic Records Loaded Here -->
        </div>
    </div>

    <script>
                const SUPABASE_URL = 'https://swndqwcujyepctncxfhr.supabase.co';
                const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN3bmRxd2N1anllcGN0bmN4ZmhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMzczNDQsImV4cCI6MjEwNTkxMzM0NH0.FcoPIUbbpIfUzxLOxUhMXiTirW2-j5Fw5dnfl9tqx2o';

                const secureClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
                let currentActiveTab = 'pending';

                function switchTab(tabName) {
                    currentActiveTab = tabName;
                    document.getElementById('pendingTabBtn').className = tabName === 'pending' ? 'tab-btn active' : 'tab-btn';
                    document.getElementById('campaignsTabBtn').className = tabName === 'campaigns' ? 'tab-btn active' : 'tab-btn';
                    loadSecureRecords();
                }

                async function loadSecureRecords() {
                    const container = document.getElementById('tableContainer');
                    if (!container || !secureClient) return;

                    container.innerHTML = '<p style="text-align: center; color: #9ca3af;">Loading records...</p>';
                    let statusQuery = currentActiveTab === 'pending' ? 'pending' : 'approved';

                    let { data, error } = await secureClient
                        .from('buysecond_records')
                        .select('*')
                        .eq('status', statusQuery)
                        .order('id', { ascending: true });

                    if (error) {
                        container.innerHTML = `<p style="text-align: center; color: #ef4444;">Error: ${error.message}</p>`;
                        return;
                    }

                    if (!data || data.length === 0) {
                        container.innerHTML = `<p style="text-align: center; color: #9ca3af;">No ${currentActiveTab} campaigns found.</p>`;
                        return;
                    }

                    let html = `
                        <div class="campaign-card">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Token / ID</th>
                                        <th>Brand Name</th>
                                        <th>Target URL</th>
                                        <th>Duration</th>
                                        <th>Media File</th>
                                        <th>Status</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;

                    data.forEach(record => {
                        let statusClass = record.status === 'approved' ? 'status-approved' : 'status-pending';
                        let displayToken = record.unified_token ? `#${record.unified_token}` : `#${record.id}`;
                        let recordJson = encodeURIComponent(JSON.stringify(record));

                        html += `
                            <tr>
                                <td><b>${displayToken}</b></td>
                                <td>${record.brand_name || 'N/A'}</td>
                                <td><a href="${record.target_url}" target="_blank" class="media-link">Visit Link</a></td>
                                <td>${record.duration_second || 10}s</td>
                                <td><button class="btn-preview" onclick="previewMedia('${recordJson}')">View Media 📺</button></td>
                                <td><span class="${statusClass}">${record.status.toUpperCase()}</span></td>
                                <td>
                                    ${currentActiveTab === 'pending' ? `<button class="btn-action btn-approve" onclick="approveCampaign(${record.id})">Approve</button>` : ''}
                                    <button class="btn-action btn-reject" onclick="updateStatus(${record.id}, 'rejected')">Reject</button>
                                    <button class="btn-action btn-delete" onclick="deleteCampaign(${record.id}, '${record.file_url || ''}')">Delete</button>
                                </td>
                            </tr>
                        `;
                    });

                    html += `</tbody></table></div>`;
                    container.innerHTML = html;
                }

                // 📺 SECURE MEDIA PREVIEW (FIXES 404 ERROR)
                async function previewMedia(encodedJson) {
                    let record = JSON.parse(decodeURIComponent(encodedJson));
                    let filePath = record.file_url || record.video_url;
                    if (!filePath) {
                        alert('No media file found!');
                        return;
                    }

                    let fileUrl = filePath;
                    if (!filePath.startsWith('http') && !filePath.startsWith('blob:')) {
                        let { data: signedData, error } = await secureClient.storage.from('ad-videos').createSignedUrl(filePath, 300);
                        if (!error && signedData && signedData.signedUrl) {
                            fileUrl = signedData.signedUrl;
                        }
                    }
                    window.open(fileUrl, '_blank');
                }

                // ✅ APPROVE CAMPAIGN & INSTANTLY TRANSFER TO CAMPAIGN DETAILS TAB
                async function approveCampaign(id) {
                    try {
                        let { data: approvedRecords } = await secureClient.from('buysecond_records').select('unified_token').eq('status', 'approved');
                        let maxToken = 0;
                        if (approvedRecords) {
                            approvedRecords.forEach(r => {
                                let t = parseInt(r.unified_token) || 0;
                                if (t > maxToken) maxToken = t;
                            });
                        }
                        let nextToken = maxToken + 1;

                        let { error } = await secureClient.from('buysecond_records').update({ status: 'approved', unified_token: nextToken }).eq('id', id);
                        if (error) throw error;

                        // Automatically switch to Campaign Details tab instantly
                        switchTab('campaigns');
                    } catch (err) {
                        alert('Approval failed: ' + err.message);
                    }
                }

                async function updateStatus(id, newStatus) {
                    let { error } = await secureClient.from('buysecond_records').update({ status: newStatus }).eq('id', id);
                    if (error) alert('Error: ' + error.message);
                    else loadSecureRecords();
                }

                async function deleteCampaign(id, fileUrl) {
                    if (!confirm('Are you sure you want to delete this campaign?')) return;
                    try {
                        if (fileUrl && fileUrl.includes('/storage/v1/object/public/ad-videos/')) {
                            let path = fileUrl.split('/storage/v1/object/public/ad-videos/')[1];
                            if (path) await secureClient.storage.from('ad-videos').remove([decodeURIComponent(path)]);
                        }
                        let { error } = await secureClient.from('buysecond_records').delete().eq('id', id);
                        if (error) throw error;
                        loadSecureRecords();
                    } catch (err) {
                        alert('Delete failed: ' + err.message);
                    }
                }

                window.addEventListener('DOMContentLoaded', loadSecureRecords);
    </script>
</body>
</html>
