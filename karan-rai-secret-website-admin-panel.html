<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Second - Admin Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #1f293d;
            padding-bottom: 15px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #38bdf8;
        }

        .back-btn {
            background: #2563eb;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .tabs-container {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .tab-btn {
            background: #121824;
            color: #9ca3af;
            border: 1px solid #1f293d;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

            .tab-btn.active {
                background: #2563eb;
                color: white;
                border-color: #2563eb;
            }

        .campaign-card {
            background: #0b0f17;
            border: 1px solid #1f293d;
            border-radius: 8px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #1f293d;
            font-size: 14px;
        }

        th {
            background: #121824;
            color: #f59e0b;
            font-weight: bold;
        }

        .sub-row td {
            background: #0d121d;
            color: #9ca3af;
            font-size: 13px;
            border-bottom: 1px solid #161e2e;
        }

        .status-approved {
            color: #10B981;
            font-weight: bold;
        }

        .status-pending {
            color: #f59e0b;
            font-weight: bold;
        }

        .status-rejected {
            color: #ef4444;
            font-weight: bold;
        }

        .btn-action {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            margin-right: 5px;
        }

        .btn-approve {
            background: #10B981;
            color: white;
        }

        .btn-reject {
            background: #f59e0b;
            color: white;
        }

        .btn-delete {
            background: #ef4444;
            color: white;
        }

        .btn-preview {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .media-link {
            color: #38bdf8;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="header">
        <div class="logo">🛠️ Buy Second Admin Dashboard</div>
        <a href="index.html" class="back-btn">← Go to Website</a>
    </div>

    <div class="tabs-container">
        <button class="tab-btn active" id="pendingTabBtn" onclick="switchTab('pending')">Pending Requests ⏳</button>
        <button class="tab-btn" id="liveTabBtn" onclick="switchTab('live')">Live / Approved Campaigns ✅</button>
    </div>

    <div id="tableContainer">
        <!-- Grouped Campaign Tables loaded here -->
    </div>

    <script>
                const SUPABASE_URL = 'https://swndqwcujyepctncxfhr.supabase.co';
                const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN3bmRxd2N1anllcGN0bmN4ZmhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMzczNDQsImV4cCI6MjEwNTkxMzM0NH0.FcoPIUbbpIfUzxLOxUhMXiTirW2-j5Fw5dnfl9tqx2o';

                const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                let currentTab = 'pending';

                function switchTab(tabName) {
                    currentTab = tabName;
                    document.getElementById('pendingTabBtn').className = tabName === 'pending' ? 'tab-btn active' : 'tab-btn';
                    document.getElementById('liveTabBtn').className = tabName === 'live' ? 'tab-btn active' : 'tab-btn';
                    loadAdminRecords();
                }

                async function loadAdminRecords() {
                    const container = document.getElementById('tableContainer');
                    container.innerHTML = '<p style="color: #9ca3af; text-align: center;">Loading campaigns...</p>';

                    let { data, error } = await supabaseClient
                        .from('buysecond_records')
                        .select('*')
                        .eq('status', currentTab === 'pending' ? 'pending' : 'approved')
                        .order('id', { ascending: true });

                    if (error) {
                        container.innerHTML = `<p style="color: #ef4444; text-align: center;">Error: ${error.message}</p>`;
                        return;
                    }

                    if (!data || data.length === 0) {
                        container.innerHTML = `<p style="color: #9ca3af; text-align: center;">No ${currentTab} campaigns found.</p>`;
                        return;
                    }

                    // Group records by file_url + brand_name (Unique Campaign Cluster)
                    let campaignGroups = {};
                    data.forEach(record => {
                        let cleanBrand = (record.brand_name || '').replace(/\s*\(Run \d+\/\d+\)/g, '').trim();
                        let key = cleanBrand + '_' + (record.file_url || record.video_url || '');
                        if (!campaignGroups[key]) {
                            campaignGroups[key] = [];
                        }
                        campaignGroups[key].push(record);
                    });

                    let html = '';
                    let groupIndex = 1;

                    for (let key in campaignGroups) {
                        let slots = campaignGroups[key];
                        let masterRecord = slots[0];
                        let displayToken = masterRecord.unified_token ? `#${masterRecord.unified_token}` : `#${groupIndex}`;
                        let statusClass = masterRecord.status === 'approved' ? 'status-approved' : 'status-pending';
                        let statusText = masterRecord.status === 'approved' ? 'APPROVED' : 'PENDING';

                        let actionButtons = '';
                        if (currentTab === 'pending') {
                            actionButtons = `
                                <button class="btn-action btn-approve" onclick="approveCampaignGroup('${key}', ${JSON.stringify(slots.map(s => s.id))})">Approve</button>
                                <button class="btn-action btn-reject" onclick="updateGroupStatus('${key}', ${JSON.stringify(slots.map(s => s.id))}, 'rejected')">Reject</button>
                                <button class="btn-action btn-delete" onclick="deleteCampaignGroup('${key}', ${JSON.stringify(slots.map(s => s.id))}, '${masterRecord.file_url || ''}')">Delete</button>
                            `;
                        } else {
                            actionButtons = `
                                <button class="btn-action btn-reject" onclick="updateGroupStatus('${key}', ${JSON.stringify(slots.map(s => s.id))}, 'rejected')">Reject</button>
                                <button class="btn-action btn-delete" onclick="deleteCampaignGroup('${key}', ${JSON.stringify(slots.map(s => s.id))}, '${masterRecord.file_url || ''}')">Delete</button>
                            `;
                        }

                        let recordJson = encodeURIComponent(JSON.stringify(masterRecord));

                        html += `
                            <div class="campaign-card">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>Token (#ID)</th>
                                            <th>Brand / Title</th>
                                            <th>Total Slots / Runs</th>
                                            <th>Duration</th>
                                            <th>Target URL</th>
                                            <th>Media File</th>
                                            <th>Status</th>
                                            <th>Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td><b>${displayToken}</b></td>
                                            <td>${masterRecord.brand_name.replace(/\s*\(Run \d+\/\d+\)/g, '')}</td>
                                            <td>${slots.length} Runs Total</td>
                                            <td>${masterRecord.duration_second}s</td>
                                            <td><a href="${masterRecord.target_url}" target="_blank" class="media-link">Visit Link</a></td>
                                            <td><button class="btn-preview" onclick="previewOnBillboard('${recordJson}')">View Media 📺</button></td>
                                            <td><span class="${statusClass}">${statusText}</span></td>
                                            <td>${actionButtons}</td>
                                        </tr>
                        `;

                        // Sub-rows for each run/slot timing
                        slots.forEach((slot, idx) => {
                            html += `
                                <tr class="sub-row">
                                    <td colspan="2" style="padding-left: 30px; color: #38bdf8;">↳ Run ${idx + 1} of ${slots.length}</td>
                                    <td colspan="6"><b>Timing:</b> ${slot.slot_time}</td>
                                </tr>
                            `;
                        });

                        html += `
                                    </tbody>
                                </table>
                            </div>
                        `;
                        groupIndex++;
                    }

                    container.innerHTML = html;
                }

                function previewOnBillboard(encodedJson) {
                    let record = JSON.parse(decodeURIComponent(encodedJson));
                    sessionStorage.setItem('admin_preview_ad', JSON.stringify(record));
                    window.location.href = 'index.html';
                }

                async function approveCampaignGroup(groupKey, idsArray) {
                    try {
                        let { data: approvedRecords } = await supabaseClient
                            .from('buysecond_records')
                            .select('unified_token')
                            .eq('status', 'approved');

                        let maxToken = 0;
                        if (approvedRecords && approvedRecords.length > 0) {
                            approvedRecords.forEach(r => {
                                let t = parseInt(r.unified_token) || 0;
                                if (t > maxToken) maxToken = t;
                            });
                        }
                        let nextToken = maxToken + 1;

                        let { error } = await supabaseClient
                            .from('buysecond_records')
                            .update({ status: 'approved', unified_token: nextToken })
                            .in('id', idsArray);

                        if (error) throw error;

                        alert(`Campaign successfully approved with Token #${nextToken}!`);
                        loadAdminRecords();
                    } catch (err) {
                        alert('Approval failed: ' + err.message);
                    }
                }

                async function updateGroupStatus(groupKey, idsArray, newStatus) {
                    let { error } = await supabaseClient
                        .from('buysecond_records')
                        .update({ status: newStatus })
                        .in('id', idsArray);

                    if (error) {
                        alert('Error: ' + error.message);
                    } else {
                        loadAdminRecords();
                    }
                }

                async function deleteCampaignGroup(groupKey, idsArray, fileUrl) {
                    if (!confirm('Kya aap is poore campaign ko delete karna chahte hain?')) return;
                    try {
                        if (fileUrl && fileUrl.includes('/storage/v1/object/public/ad-videos/')) {
                            let filePath = fileUrl.split('/storage/v1/object/public/ad-videos/')[1];
                            if (filePath) {
                                await supabaseClient.storage.from('ad-videos').remove([decodeURIComponent(filePath)]);
                            }
                        }
                        let { error } = await supabaseClient.from('buysecond_records').delete().in('id', idsArray);
                        if (error) throw error;
                        loadAdminRecords();
                    } catch (err) {
                        alert('Delete failed: ' + err.message);
                    }
                }

                window.addEventListener('DOMContentLoaded', loadAdminRecords);
    </script>
</body>
</html>
