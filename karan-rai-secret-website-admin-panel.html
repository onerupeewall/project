<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Second - Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #1f293d;
            padding-bottom: 15px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #38bdf8;
        }

        .back-btn {
            background: #2563eb;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #0b0f17;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #1f293d;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #1f293d;
            font-size: 14px;
        }

        th {
            background: #121824;
            color: #f59e0b;
            font-weight: bold;
        }

        tr:hover {
            background: #121824;
        }

        /* Month Divider Row Styling */
        .month-header-row {
            background: #1e293b !important;
            color: #38bdf8;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            letter-spacing: 1px;
            padding: 15px;
        }

        .status-approved {
            color: #10B981;
            font-weight: bold;
        }

        .status-pending {
            color: #f59e0b;
            font-weight: bold;
        }

        .status-rejected {
            color: #ef4444;
            font-weight: bold;
        }

        .btn-action {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            margin-right: 5px;
            margin-bottom: 4px;
        }

        .btn-approve {
            background: #10B981;
            color: white;
        }

        .btn-reject {
            background: #f59e0b;
            color: white;
        }

        .btn-delete {
            background: #ef4444;
            color: white;
        }

        .media-link {
            color: #38bdf8;
            text-decoration: underline;
        }
    </style>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="header">
        <div class="logo">🛠️ Buy Second Admin Dashboard</div>
        <a href="index.html" class="back-btn">← Go to Website</a>
    </div>

    <div style="overflow-x: auto;">
        <table id="adminTable">
            <thead>
                <tr>
                    <th>Token (#ID)</th>
                    <th>Brand / Title</th>
                    <th>Slot Time & Date</th>
                    <th>Duration</th>
                    <th>Target URL</th>
                    <th>Media File</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="adminTableBody">
                <tr>
                    <td colspan="8" style="text-align: center; color: #9ca3af;">Loading records...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
                const SUPABASE_URL = 'https://swndqwcujyepctncxfhr.supabase.co';
                const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6In3bmRxd2N1anllcGN0bmN4ZmhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMzczNDQsImV4cCI6MjEwNTkxMzM0NH0.FcoPIUbbpIfUzxLOxUhMXiTirW2-j5Fw5dnfl9tqx2o';
                const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

                async function loadAdminRecords() {
                    const tbody = document.getElementById('adminTableBody');

                    let { data, error } = await supabaseClient
                        .from('buysecond_records')
                        .select('*')
                        .order('id', { ascending: true });

                    if (error) {
                        tbody.innerHTML = `<tr><td colspan="8" style="color: #ef4444; text-align: center;">Error loading data: ${error.message}</td></tr>`;
                        return;
                    }

                    if (!data || data.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: #9ca3af;">No bookings found yet.</td></tr>`;
                        return;
                    }

                    // Group records by Month & Year (extracted from slot_time)
                    let groupedByMonth = {};

                    data.forEach(record => {
                        let slotTimeStr = record.slot_time || '';
                        // Expected format: "October 07, 2026 at 8:00:00 AM" or similar
                        let monthYearKey = 'Other / General';

                        let monthsList = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
                        for (let m of monthsList) {
                            if (slotTimeStr.includes(m)) {
                                // Extract year as well if present (e.g. 2026)
                                let yearMatch = slotTimeStr.match(/\d{4}/);
                                let yearStr = yearMatch ? yearMatch[0] : '';
                                monthYearKey = yearStr ? `${m} ${yearStr}` : m;
                                break;
                            }
                        }

                        if (!groupedByMonth[monthYearKey]) {
                            groupedByMonth[monthYearKey] = [];
                        }
                        groupedByMonth[monthYearKey].push(record);
                    });

                    tbody.innerHTML = '';

                    // Render table grouped by Month rows
                    for (let monthKey in groupedByMonth) {
                        // 1. Create Month Header Row spanning all 8 columns
                        let monthTr = document.createElement('tr');
                        monthTr.innerHTML = `<td colspan="8" class="month-header-row">📅 ${monthKey.toUpperCase()}</td>`;
                        tbody.appendChild(monthTr);

                        // 2. Render records under this month
                        groupedByMonth[monthKey].forEach((record, index) => {
                            let statusClass = 'status-pending';
                            let statusText = 'Pending ⏳';

                            if (record.status === 'approved') {
                                statusClass = 'status-approved';
                                statusText = 'Approved ✅';
                            } else if (record.status === 'rejected') {
                                statusClass = 'status-rejected';
                                statusText = 'Rejected ❌';
                            }

                            let fileUrl = record.file_url || record.video_url || '#';
                            let displayToken = record.id ? record.id : (index + 1);

                            let actionButtons = `
                                <button class="btn-action btn-approve" onclick="updateStatus(${record.id}, 'approved')">Approve</button>
                                <button class="btn-action btn-reject" onclick="updateStatus(${record.id}, 'rejected')">Reject</button>
                                <button class="btn-action btn-delete" onclick='deleteRecord(${record.id}, ${JSON.stringify(fileUrl)})'>Delete</button>
                            `;

                            let tr = document.createElement('tr');
                            tr.innerHTML = `
                                <td><b>#${displayToken}</b></td>
                                <td>${record.brand_name || 'N/A'}</td>
                                <td>${record.slot_time || 'N/A'}</td>
                                <td>${record.duration_second}s</td>
                                <td><a href="${record.target_url}" target="_blank" class="media-link">Visit Link</a></td>
                                <td><a href="${fileUrl}" target="_blank" class="media-link">View Media</a></td>
                                <td><span class="${statusClass}">${statusText}</span></td>
                                <td>${actionButtons}</td>
                            `;
                            tbody.appendChild(tr);
                        });
                    }
                }

                async function updateStatus(id, newStatus) {
                    let { error } = await supabaseClient
                        .from('buysecond_records')
                        .update({ status: newStatus })
                        .eq('id', id);

                    if (error) {
                        alert('Status update karne mein error aayi: ' + error.message);
                    } else {
                        alert(`Record successfully ${newStatus} ho gaya!`);
                        loadAdminRecords();
                    }
                }

                async function deleteRecord(id, fileUrl) {
                    if (!confirm(`Kya aap token #${id} ko database aur storage dono se permanently delete karna chahte hain?`)) return;

                    try {
                        if (fileUrl && fileUrl.includes('/storage/v1/object/public/ad-videos/')) {
                            let filePath = fileUrl.split('/storage/v1/object/public/ad-videos/')[1];
                            if (filePath) {
                                await supabaseClient.storage
                                    .from('ad-videos')
                                    .remove([decodeURIComponent(filePath)]);
                            }
                        }

                        let { error: dbError } = await supabaseClient
                            .from('buysecond_records')
                            .delete()
                            .eq('id', id);

                        if (dbError) throw dbError;

                        alert('Record aur Storage file successfully delete ho gayi!');
                        loadAdminRecords();

                    } catch (err) {
                        alert('Delete karne mein error aayi: ' + (err.message || err));
                        console.error(err);
                    }
                }

                window.addEventListener('DOMContentLoaded', loadAdminRecords);
    </script>
</body>
</html>
