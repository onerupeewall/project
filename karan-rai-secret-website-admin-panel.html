<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Second - Admin Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            padding: 15px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #1f293d;
            padding-bottom: 15px;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #38bdf8;
        }

        .back-btn {
            background: #2563eb;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
        }

        .tabs-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 5px;
        }

        .tab-btn {
            background: #121824;
            color: #9ca3af;
            border: 1px solid #1f293d;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            flex-shrink: 0;
        }

            .tab-btn.active {
                background: #2563eb;
                color: white;
                border-color: #2563eb;
            }

        .global-table-scroll-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-bottom: 20px;
        }

        .campaign-card {
            background: #0b0f17;
            margin-bottom: 20px;
            border-radius: 8px;
            width: 100%;
            min-width: 950px;
            border: 1px solid #1f293d;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid #1f293d;
            font-size: 13px;
            white-space: nowrap;
        }

        th {
            background: #121824;
            color: #f59e0b;
            font-weight: bold;
        }

        .runs-scroll-box {
            max-height: 220px;
            overflow-y: auto;
            background: #070a10;
        }

        .sub-row td {
            background: #0d121d;
            color: #9ca3af;
            font-size: 13px;
            border-bottom: 1px solid #161e2e;
        }

        .day-divider-line {
            border: 0;
            border-top: 1px solid #38bdf8;
            margin: 8px 15px;
        }

        .status-approved {
            color: #10B981;
            font-weight: bold;
        }

        .status-pending {
            color: #f59e0b;
            font-weight: bold;
        }

        .status-rejected {
            color: #ef4444;
            font-weight: bold;
        }

        .btn-action {
            padding: 6px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
            margin-right: 4px;
        }

        .btn-approve {
            background: #10B981;
            color: white;
        }

        .btn-reject {
            background: #f59e0b;
            color: white;
        }

        .btn-delete {
            background: #ef4444;
            color: white;
        }

        .btn-preview {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
        }

        .media-link {
            color: #38bdf8;
            text-decoration: underline;
            cursor: pointer;
        }

        .phone-link {
            color: #38bdf8;
            cursor: pointer;
            font-weight: bold;
            text-decoration: underline;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="header">
        <div class="logo">🛠️ Buy Second Admin Dashboard</div>
        <a href="index.html" class="back-btn">← Go to Website</a>
    </div>

    <div class="tabs-container">
        <button class="tab-btn active" id="pendingTabBtn" onclick="switchTab('pending')">Pending Requests ⏳</button>
        <button class="tab-btn" id="campaignsTabBtn" onclick="switchTab('campaigns')">Campaign Details ✅</button>
        <button class="tab-btn" id="livePlayTabBtn" onclick="switchTab('livePlay')">Live Screen Play 📺</button>
        <button class="tab-btn" id="userRecordsTabBtn" onclick="switchTab('userRecords')">User Records & Archive 📂</button>
    </div>

    <div class="global-table-scroll-wrapper">
        <div id="tableContainer">
            <!-- Dynamic Loaded Campaigns -->
        </div>
    </div>

    <!-- USER CAMPAIGN DETAILS MODAL POPUP -->
    <div id="userPopupModal" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); display:none; align-items:center; justify-content:center; z-index:9999;">
        <div style="background:#121824; padding:20px; border-radius:10px; border:1px solid #1f293d; width:90%; max-width:650px; color:#fff; max-height:85vh; overflow-y:auto;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom:1px solid #1f293d; padding-bottom:10px;">
                <h3 id="popupUserTitle" style="color:#38bdf8; font-size:16px;">User History</h3>
                <button onclick="document.getElementById('userPopupModal').style.display='none'" style="background:#ef4444; color:#fff; border:none; padding:5px 10px; border-radius:4px; cursor:pointer; font-weight:bold;">✕ Close</button>
            </div>
            <div id="popupUserContent">
                <!-- User Campaigns Loaded Here -->
            </div>
        </div>
    </div>

    <script>
                const SUPABASE_URL = 'https://swndqwcujyepctncxfhr.supabase.co';
                const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN3bmRxd2N1anllcGN0bmN4ZmhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMzczNDQsImV4cCI6MjEwNTkxMzM0NH0.FcoPIUbbpIfUzxLOxUhMXiTirW2-j5Fw5dnfl9tqx2o';

                // Safe initialization to prevent null client errors
                const adminClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
                let adminCurrentTab = 'pending';

                function switchTab(tabName) {
                    adminCurrentTab = tabName;
                    document.getElementById('pendingTabBtn').className = tabName === 'pending' ? 'tab-btn active' : 'tab-btn';
                    document.getElementById('campaignsTabBtn').className = tabName === 'campaigns' ? 'tab-btn active' : 'tab-btn';
                    document.getElementById('livePlayTabBtn').className = tabName === 'livePlay' ? 'tab-btn active' : 'tab-btn';
                    document.getElementById('userRecordsTabBtn').className = tabName === 'userRecords' ? 'tab-btn active' : 'tab-btn';
                    loadAdminRecords();
                }

                async function loadAdminRecords() {
                    const container = document.getElementById('tableContainer');
                    if (!container) return;

                    if (!adminClient) {
                        container.innerHTML = `<p style="color: #ef4444; text-align: center;">Supabase client failed to load.</p>`;
                        return;
                    }

                    container.innerHTML = '<p style="color: #9ca3af; text-align: center;">Loading campaigns...</p>';

                    if (adminCurrentTab === 'livePlay') {
                        loadLiveScreenPlayView(container);
                        return;
                    }

                    if (adminCurrentTab === 'userRecords') {
                        loadUserRecordsView(container);
                        return;
                    }

                    let statusQuery = adminCurrentTab === 'pending' ? 'pending' : 'approved';
                    let { data, error } = await adminClient
                        .from('buysecond_records')
                        .select('*')
                        .eq('status', statusQuery)
                        .order('id', { ascending: true });

                    if (error) {
                        container.innerHTML = `<p style="color: #ef4444; text-align: center;">Error: ${error.message}</p>`;
                        return;
                    }

                    if (!data || data.length === 0) {
                        container.innerHTML = `<p style="color: #9ca3af; text-align: center;">No ${adminCurrentTab} campaigns found.</p>`;
                        return;
                    }

                    let campaignGroups = {};
                    data.forEach(record => {
                        let cleanBrand = (record.brand_name || '').replace(/\s*\(Run \d+\/\d+\)/g, '').trim();
                        let key = cleanBrand + '_' + (record.file_url || record.video_url || '');
                        if (!campaignGroups[key]) campaignGroups[key] = [];
                        campaignGroups[key].push(record);
                    });

                    let html = '';
                    let groupIndex = 1;

                    for (let key in campaignGroups) {
                        let slots = campaignGroups[key];
                        let masterRecord = slots[0];
                        let displayToken = masterRecord.unified_token ? `#${masterRecord.unified_token}` : `#${groupIndex}`;
                        let statusClass = masterRecord.status === 'approved' ? 'status-approved' : 'status-pending';
                        let statusText = masterRecord.status === 'approved' ? 'APPROVED' : 'PENDING';

                        let firstDateStr = slots[0].slot_time.split(' at ')[0];
                        let lastDateStr = slots[slots.length - 1].slot_time.split(' at ')[0];
                        let freqCount = slots.filter(s => s.slot_time.includes(firstDateStr)).length;
                        let scheduleInfo = (firstDateStr === lastDateStr) ? `${firstDateStr} (${freqCount}x/day)` : `${firstDateStr} to ${lastDateStr} (${freqCount}x/day)`;

                        let thirdColumnHeader = adminCurrentTab === 'pending' ? 'Schedule (Date Range & Freq)' : 'Total Runs';
                        let thirdColumnValue = adminCurrentTab === 'pending' ? scheduleInfo : `${slots.length} Runs Total`;

                        let actionButtons = adminCurrentTab === 'pending' ? `
                            <button class="btn-action btn-approve" onclick="approveCampaignGroup(${JSON.stringify(slots.map(s => s.id))})">Approve</button>
                            <button class="btn-action btn-reject" onclick="updateGroupStatus(${JSON.stringify(slots.map(s => s.id))}, 'rejected')">Reject</button>
                            <button class="btn-action btn-delete" onclick="deleteCampaignGroup(${JSON.stringify(slots.map(s => s.id))}, '${masterRecord.file_url || ''}')">Delete</button>
                        ` : `
                            <button class="btn-action btn-reject" onclick="updateGroupStatus(${JSON.stringify(slots.map(s => s.id))}, 'rejected')">Reject</button>
                            <button class="btn-action btn-delete" onclick="deleteCampaignGroup(${JSON.stringify(slots.map(s => s.id))}, '${masterRecord.file_url || ''}')">Delete</button>
                        `;

                        let recordJson = encodeURIComponent(JSON.stringify(masterRecord));

                        html += `
                            <div class="campaign-card">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>Token (#ID)</th>
                                            <th>Brand / Title</th>
                                            <th>${thirdColumnHeader}</th>
                                            <th>Duration</th>
                                            <th>Target URL</th>
                                            <th>Media File</th>
                                            <th>Status</th>
                                            <th>Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td><b>${displayToken}</b></td>
                                            <td>${(masterRecord.brand_name || '').replace(/\s*\(Run \d+\/\d+\)/g, '')}</td>
                                            <td>${thirdColumnValue}</td>
                                            <td>${masterRecord.duration_second || 10}s</td>
                                            <td><a href="${masterRecord.target_url}" target="_blank" class="media-link">Visit Link</a></td>
                                            <td><button class="btn-preview" onclick="previewOnBillboard('${recordJson}')">View Media 📺</button></td>
                                            <td><span class="${statusClass}">${statusText}</span></td>
                                            <td>${actionButtons}</td>
                                        </tr>
                                    </tbody>
                                </table>
                        `;

                        if (adminCurrentTab === 'campaigns') {
                            html += `
                                    <div class="runs-scroll-box">
                                        <table>
                                            <tbody>
                            `;

                            let lastDateRow = '';
                            slots.forEach((slot, idx) => {
                                let datePart = slot.slot_time.split(' at ')[0];
                                if (datePart !== lastDateRow) {
                                    if (lastDateRow !== '') {
                                        html += `<tr><td colspan="8" style="padding:0;"><hr class="day-divider-line"></td></tr>`;
                                    }
                                    html += `
                                        <tr class="sub-row">
                                            <td colspan="8" style="color: #38bdf8; font-weight: bold; background: #090d16;">📅 Date: ${datePart}</td>
                                        </tr>
                                    `;
                                    lastDateRow = datePart;
                                }
                                html += `
                                    <tr class="sub-row">
                                        <td colspan="2" style="padding-left: 25px; color: #10B981;">✅ Run ${idx + 1} of ${slots.length}</td>
                                        <td colspan="6"><b>Timing:</b> ${slot.slot_time}</td>
                                    </tr>
                                `;
                            });

                            html += `
                                            </tbody>
                                        </table>
                                    </div>
                            `;
                        }

                        html += `
                            </div>
                        `;
                        groupIndex++;
                    }

                    container.innerHTML = html;
                }
         async function loadUserRecordsView(container) {
                    let { data, error } = await adminClient.from('buysecond_records').select('*').order('id', { ascending: false });
                    if (error || !data || data.length === 0) {
                        container.innerHTML = `<p style="color: #9ca3af; text-align: center;">No user records found.</p>`;
                        return;
                    }

                    let usersMap = {};
                    data.forEach(record => {
                        let phone = record.user_phone || 'Unknown / Guest';
                        if (!usersMap[phone]) {
                            usersMap[phone] = {
                                records: [],
                                otp: record.user_otp || '123456'
                            };
                        }
                        usersMap[phone].records.push(record);
                    });

                    let html = `
                        <div class="campaign-card">
                            <table>
                                <thead>
                                    <tr>
                                        <th style="width: 80px;">S.No.</th>
                                        <th>User Mobile Number</th>
                                        <th>Assigned OTP Code</th>
                                        <th>Total Booked Records</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;

                    let idx = 1;
                    for (let phone in usersMap) {
                        let userInfo = usersMap[phone];
                        html += `
                            <tr>
                                <td><b>#${idx}</b></td>
                                <td><span class="phone-link" onclick="openUserPopup('${phone}')">📞 ${phone}</span></td>
                                <td><span style="background:#1f293d; color:#38bdf8; padding:4px 8px; border-radius:4px; font-weight:bold;">🔑 ${userInfo.otp}</span></td>
                                <td>${userInfo.records.length} Total Slots</td>
                                <td><button class="btn-preview" onclick="openUserPopup('${phone}')">View Summary 📂</button></td>
                            </tr>
                        `;
                        idx++;
                    }

                    html += `
                                </tbody>
                            </table>
                        </div>
                    `;
                    container.innerHTML = html;
                }

                async function openUserPopup(phone) {
                    const modal = document.getElementById('userPopupModal');
                    const title = document.getElementById('popupUserTitle');
                    const content = document.getElementById('popupUserContent');

                    title.innerText = `📂 Campaigns Summary for Mobile: ${phone}`;
                    content.innerHTML = '<p style="color:#9ca3af; text-align:center;">Loading campaigns...</p>';
                    modal.style.display = 'flex';

                    let { data, error } = await adminClient.from('buysecond_records').select('*').eq('user_phone', phone).order('id', { ascending: true });

                    if (error || !data || data.length === 0) {
                        content.innerHTML = '<p style="color:#ef4444; text-align:center;">No records found for this number.</p>';
                        return;
                    }

                    let userCampaignGroups = {};
                    data.forEach(record => {
                        let cleanBrand = (record.brand_name || '').replace(/\s*\(Run \d+\/\d+\)/g, '').trim();
                        let key = cleanBrand + '_' + (record.file_url || record.video_url || '');
                        if (!userCampaignGroups[key]) userCampaignGroups[key] = [];
                        userCampaignGroups[key].push(record);
                    });

                    let html = '';
                    let campIdx = 1;

                    for (let key in userCampaignGroups) {
                        let slots = userCampaignGroups[key];
                        let master = slots[0];
                        let tokenText = master.unified_token ? `#${master.unified_token}` : 'Pending Token';
                        let statusColor = master.status === 'approved' ? '#10B981' : (master.status === 'pending' ? '#f59e0b' : '#ef4444');
                        let cleanBrandName = master.brand_name.replace(/\s*\(Run \d+\/\d+\)/g, '');

                        let firstDateStr = slots[0].slot_time.split(' at ')[0];
                        let lastDateStr = slots[slots.length - 1].slot_time.split(' at ')[0];
                        let freqCount = slots.filter(s => s.slot_time.includes(firstDateStr)).length;
                        let dateRangeInfo = (firstDateStr === lastDateStr) ? firstDateStr : `${firstDateStr} to ${lastDateStr}`;

                        html += `
                            <div style="background:#0b0f17; border:1px solid #1f293d; padding:14px; border-radius:6px; margin-bottom:12px;">
                                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; border-bottom:1px solid #161e2e; padding-bottom:6px;">
                                    <span style="color:#38bdf8; font-weight:bold; font-size:15px;">#${campIdx}. ${cleanBrandName}</span>
                                    <span style="color:${statusColor}; font-weight:bold; font-size:12px; text-transform:uppercase;">${master.status}</span>
                                </div>
                                <div style="font-size:13px; color:#9ca3af; display:grid; grid-template-columns: 1fr 1fr; gap:6px;">
                                    <p><b>Token:</b> ${tokenText}</p>
                                    <p><b>OTP Code:</b> <span style="color:#38bdf8;">${master.user_otp || 'N/A'}</span></p>
                                    <p><b>Duration:</b> ${master.duration_second}s per run</p>
                                    <p><b>Date Range:</b> ${dateRangeInfo}</p>
                                    <p><b>Frequency:</b> ${freqCount} Runs / Day</p>
                                    <p><b>Total Runs:</b> ${slots.length} Runs</p>
                                    <p><b>Target URL:</b> <a href="${master.target_url}" target="_blank" style="color:#38bdf8; text-decoration:underline;">Visit Link</a></p>
                                </div>
                            </div>
                        `;
                        campIdx++;
                    }

                    content.innerHTML = html;
                }

                async function loadLiveScreenPlayView(container) {
                    let { data: approvedRecords, error } = await adminClient
                        .from('buysecond_records')
                        .select('*')
                        .eq('status', 'approved')
                        .order('id', { ascending: true });

                    if (error || !approvedRecords || approvedRecords.length === 0) {
                        container.innerHTML = `<p style="color: #9ca3af; text-align: center;">No active live screen play records found.</p>`;
                        return;
                    }

                    let now = new Date();
                    let optionsCheck = { day: '2-digit', month: 'long', year: 'numeric' };
                    let todayDateStr = now.toLocaleDateString('en-US', optionsCheck);

                    let todayAds = approvedRecords.filter(rec => rec.slot_time && rec.slot_time.includes(todayDateStr));
                    if (todayAds.length === 0) {
                        container.innerHTML = `<p style="color: #f59e0b; text-align: center;">No approved ads scheduled for today (${todayDateStr}).</p>`;
                        return;
                    }

                    let dayStart = new Date(now);
                    dayStart.setHours(0, 0, 0, 0);

                    let timelineItems = [];
                    todayAds.forEach(ad => {
                        let timePart = ad.slot_time.split(' at ')[1];
                        if (!timePart) return;
                        let [timeStr, modifier] = timePart.split(' ');
                        let [hrs, mins, secs] = timeStr.split(':').map(Number);
                        if (modifier === 'PM' && hrs < 12) hrs += 12;
                        if (modifier === 'AM' && hrs === 12) hrs = 0;

                        let adStart = new Date(dayStart);
                        adStart.setHours(hrs, mins, secs);
                        let dur = parseInt(ad.duration_second) || 10;
                        let adEnd = new Date(adStart.getTime() + (dur * 1000));
                        timelineItems.push({ record: ad, start: adStart, end: adEnd, duration: dur });
                    });

                    let currentTime = new Date();
                    let html = `
                        <div class="campaign-card">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Token</th>
                                        <th>Brand Name</th>
                                        <th>Scheduled Time</th>
                                        <th>Duration</th>
                                        <th>Live Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;

                    let activeFound = false;
                    timelineItems.forEach((item) => {
                        let cleanBrand = item.record.brand_name.replace(/\s*\(Run \s*\d+\/\d+\)/g, '');
                        let token = item.record.unified_token ? `#${item.record.unified_token}` : `#${item.record.id}`;
                        let timeOnly = item.record.slot_time.split(' at ')[1] || '';

                        if (currentTime > item.end) return;

                        let statusBadge = '';
                        if (!activeFound && currentTime >= item.start && currentTime <= item.end) {
                            statusBadge = `<span style="background: #10B981; color: white; padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 11px;">📺 PLAYING NOW</span>`;
                            activeFound = true;
                        } else if (!activeFound) {
                            statusBadge = `<span style="background: #3b82f6; color: white; padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 11px;">NEXT UP ⏳</span>`;
                            activeFound = true;
                        } else {
                            statusBadge = `<span style="color: #9ca3af; font-size: 12px;">Upcoming</span>`;
                        }

                        html += `
                            <tr>
                                <td><b>${token}</b></td>
                                <td>${cleanBrand}</td>
                                <td>${timeOnly}</td>
                                <td>${item.duration}s</td>
                                <td>${statusBadge}</td>
                            </tr>
                        `;
                    });

                    html += `
                                </tbody>
                            </table>
                        </div>
                    `;
                    container.innerHTML = html;
                }

                function previewOnBillboard(encodedJson) {
                    let record = JSON.parse(decodeURIComponent(encodedJson));
                    let fileUrl = record.file_url || record.video_url;
                    if (!fileUrl) {
                        alert('Media file not found!');
                        return;
                    }
                    window.open(fileUrl, '_blank');
                }

                async function approveCampaignGroup(idsArray) {
                    try {
                        let { data: approvedRecords } = await adminClient.from('buysecond_records').select('unified_token').eq('status', 'approved');
                        let maxToken = 0;
                        if (approvedRecords && approvedRecords.length > 0) {
                            approvedRecords.forEach(r => {
                                let t = parseInt(r.unified_token) || 0;
                                if (t > maxToken) maxToken = t;
                            });
                        }
                        let nextToken = maxToken + 1;

                        let { error } = await adminClient.from('buysecond_records').update({ status: 'approved', unified_token: nextToken }).in('id', idsArray);
                        if (error) throw error;

                        alert(`Campaign successfully approved with Token #${nextToken}!`);
                        loadAdminRecords();
                    } catch (err) {
                        alert('Approval failed: ' + err.message);
                    }
                }

                async function updateGroupStatus(idsArray, newStatus) {
                    let { error } = await adminClient.from('buysecond_records').update({ status: newStatus }).in('id', idsArray);
                    if (error) alert('Error: ' + error.message);
                    else loadAdminRecords();
                }

                async function deleteCampaignGroup(idsArray, fileUrl) {
                    if (!confirm('Are you sure you want to delete this campaign?')) return;
                    try {
                        if (fileUrl && fileUrl.includes('/storage/v1/object/public/ad-videos/')) {
                            let filePath = fileUrl.split('/storage/v1/object/public/ad-videos/')[1];
                            if (filePath) await adminClient.storage.from('ad-videos').remove([decodeURIComponent(filePath)]);
                        }
                        let { error } = await adminClient.from('buysecond_records').delete().in('id', idsArray);
                        if (error) throw error;
                        loadAdminRecords();
                    } catch (err) {
                        alert('Delete failed: ' + err.message);
                    }
                }

                window.addEventListener('DOMContentLoaded', loadAdminRecords);
                setInterval(() => {
                    if (adminCurrentTab === 'livePlay') loadAdminRecords();
                }, 5000);
    </script>
</body>
</html>
