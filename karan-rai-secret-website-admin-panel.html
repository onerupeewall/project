<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Second - Admin Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #1f293d;
            padding-bottom: 15px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #38bdf8;
        }

        .back-btn {
            background: #2563eb;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .tabs-container {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .tab-btn {
            background: #121824;
            color: #9ca3af;
            border: 1px solid #1f293d;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

            .tab-btn.active {
                background: #2563eb;
                color: white;
                border-color: #2563eb;
            }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #0b0f17;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #1f293d;
            margin-bottom: 15px;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #1f293d;
            font-size: 14px;
        }

        th {
            background: #121824;
            color: #f59e0b;
            font-weight: bold;
        }

        tr:hover {
            background: #121824;
        }

        .status-approved {
            color: #10B981;
            font-weight: bold;
        }

        .status-pending {
            color: #f59e0b;
            font-weight: bold;
        }

        .status-rejected {
            color: #ef4444;
            font-weight: bold;
        }

        .btn-action {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            margin-right: 5px;
            margin-bottom: 4px;
        }

        .btn-approve {
            background: #10B981;
            color: white;
        }

        .btn-reject {
            background: #f59e0b;
            color: white;
        }

        .btn-delete {
            background: #ef4444;
            color: white;
        }

        .btn-preview {
            background: #3b82f6;
            color: white;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .media-link {
            color: #38bdf8;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="header">
        <div class="logo">🛠️ Buy Second Admin Dashboard</div>
        <a href="index.html" class="back-btn">← Go to Website</a>
    </div>

    <!-- Tabs to switch between Pending Requests and Live/Approved Campaigns -->
    <div class="tabs-container">
        <button class="tab-btn active" id="pendingTabBtn" onclick="switchTab('pending')">Pending Requests ⏳</button>
        <button class="tab-btn" id="liveTabBtn" onclick="switchTab('live')">Live / Approved Campaigns ✅</button>
    </div>

    <div style="overflow-x: auto;" id="tableContainer">
        <!-- Records dynamically loaded here -->
    </div>

    <script>
                const SUPABASE_URL = 'https://swndqwcujyepctncxfhr.supabase.co';
                const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN3bmRxd2N1anllcGN0bmN4ZmhyIiwicm9sZSI6InN1cGFiYXNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMzczNDQsImV4cCI6MjEwNTkxMzM0NH0.FcoPIUbbpIfUzxLOxUhMXiTirW2-j5Fw5dnfl9tqx2o';

                const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

                let currentTab = 'pending';

                function switchTab(tabName) {
                    currentTab = tabName;
                    document.getElementById('pendingTabBtn').className = tabName === 'pending' ? 'tab-btn active' : 'tab-btn';
                    document.getElementById('liveTabBtn').className = tabName === 'live' ? 'tab-btn active' : 'tab-btn';
                    loadAdminRecords();
                }

                async function loadAdminRecords() {
                    const container = document.getElementById('tableContainer');
                    container.innerHTML = '<p style="color: #9ca3af; text-align: center;">Loading records...</p>';

                    let query = supabaseClient.from('buysecond_records').select('*').order('id', { ascending: false });

                    if (currentTab === 'pending') {
                        query = query.eq('status', 'pending');
                    } else {
                        query = query.eq('status', 'approved');
                    }

                    let { data, error } = await query;

                    if (error) {
                        container.innerHTML = `<p style="color: #ef4444; text-align: center;">Error loading data: ${error.message}</p>`;
                        return;
                    }

                    if (!data || data.length === 0) {
                        container.innerHTML = `<p style="color: #9ca3af; text-align: center;">No ${currentTab} records found.</p>`;
                        return;
                    }

                    let html = '';

                    data.forEach((record) => {
                        let fileUrl = record.file_url || record.video_url || '#';
                        let displayToken = record.unified_token ? `#${record.unified_token}` : 'Not Assigned';
                        let statusClass = record.status === 'approved' ? 'status-approved' : (record.status === 'rejected' ? 'status-rejected' : 'status-pending');
                        let statusText = record.status === 'approved' ? 'APPROVED' : (record.status === 'rejected' ? 'REJECTED' : 'PENDING');

                        let actionButtons = '';
                        if (currentTab === 'pending') {
                            actionButtons = `
                                <button class="btn-action btn-approve" onclick="approveCampaign(${record.id})">Approve & Assign Token</button>
                                <button class="btn-action btn-reject" onclick="updateStatus(${record.id}, 'rejected')">Reject</button>
                                <button class="btn-action btn-delete" onclick="deleteRecord(${record.id}, '${fileUrl}')">Delete</button>
                            `;
                        } else {
                            actionButtons = `
                                <button class="btn-action btn-reject" onclick="updateStatus(${record.id}, 'rejected')">Reject</button>
                                <button class="btn-action btn-delete" onclick="deleteRecord(${record.id}, '${fileUrl}')">Delete</button>
                            `;
                        }

                        // Encapsulate record data to pass to preview function safely
                        let recordJson = encodeURIComponent(JSON.stringify(record));

                        html += `
                            <table>
                                <tr>
                                    <th>Token (#ID)</th>
                                    <th>Brand / Title</th>
                                    <th>Slot Time & Date</th>
                                    <th>Duration</th>
                                    <th>Target URL</th>
                                    <th>Media File</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                                <tr>
                                    <td><b>${displayToken}</b></td>
                                    <td>${record.brand_name || 'N/A'}</td>
                                    <td>${record.slot_time || 'N/A'}</td>
                                    <td>${record.duration_second}s</td>
                                    <td><a href="${record.target_url}" target="_blank" class="media-link">Visit Link</a></td>
                                    <td><button class="btn-action btn-preview" onclick="previewOnBillboard('${recordJson}')">View on Billboard 📺</button></td>
                                    <td><span class="${statusClass}">${statusText}</span></td>
                                    <td>${actionButtons}</td>
                                </tr>
                            </table>
                        `;
                    });

                    container.innerHTML = html;
                }

                function previewOnBillboard(encodedJson) {
                    let record = JSON.parse(decodeURIComponent(encodedJson));
                    localStorage.setItem('admin_preview_ad', JSON.stringify(record));
                    window.location.href = 'index.html';
                }

                async function approveCampaign(recordId) {
                    try {
                        let { data: approvedRecords } = await supabaseClient
                            .from('buysecond_records')
                            .select('unified_token')
                            .eq('status', 'approved');

                        let maxToken = 0;
                        if (approvedRecords && approvedRecords.length > 0) {
                            approvedRecords.forEach(r => {
                                let t = parseInt(r.unified_token) || 0;
                                if (t > maxToken) maxToken = t;
                            });
                        }
                        let nextToken = maxToken + 1;

                        let { error } = await supabaseClient
                            .from('buysecond_records')
                            .update({
                                status: 'approved',
                                unified_token: nextToken
                            })
                            .eq('id', recordId);

                        if (error) throw error;

                        alert(`Campaign successfully approved with Token #${nextToken}!`);
                        loadAdminRecords();

                    } catch (err) {
                        alert('Approval failed: ' + err.message);
                    }
                }

                async function updateStatus(id, newStatus) {
                    let { error } = await supabaseClient
                        .from('buysecond_records')
                        .update({ status: newStatus })
                        .eq('id', id);

                    if (error) {
                        alert('Error: ' + error.message);
                    } else {
                        loadAdminRecords();
                    }
                }

                async function deleteRecord(id, fileUrl) {
                    if (!confirm(`Kya aap is record ko delete karna chahte hain?`)) return;

                    try {
                        if (fileUrl && fileUrl.includes('/storage/v1/object/public/ad-videos/')) {
                            let filePath = fileUrl.split('/storage/v1/object/public/ad-videos/')[1];
                            if (filePath) {
                                await supabaseClient.storage.from('ad-videos').remove([decodeURIComponent(filePath)]);
                            }
                        }

                        let { error } = await supabaseClient.from('buysecond_records').delete().eq('id', id);
                        if (error) throw error;

                        loadAdminRecords();
                    } catch (err) {
                        alert('Delete failed: ' + err.message);
                    }
                }

                window.addEventListener('DOMContentLoaded', loadAdminRecords);
    </script>
</body>
</html>
