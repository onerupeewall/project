<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Second - Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #1f293d;
            padding-bottom: 15px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #38bdf8;
        }

        .back-btn {
            background: #2563eb;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #0b0f17;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #1f293d;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #1f293d;
            font-size: 14px;
        }

        th {
            background: #121824;
            color: #f59e0b;
            font-weight: bold;
        }

        tr:hover {
            background: #121824;
        }

        .status-approved {
            color: #34d399;
            font-weight: bold;
        }

        .status-pending {
            color: #f59e0b;
            font-weight: bold;
        }

        .btn-action {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            margin-right: 5px;
        }

        .btn-approve {
            background: #10B981;
            color: white;
        }

        .btn-delete {
            background: #ef4444;
            color: white;
        }

        .media-link {
            color: #38bdf8;
            text-decoration: underline;
        }
    </style>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="header">
        <div class="logo">🛠️ Buy Second Admin Dashboard</div>
        <a href="index.html" class="back-btn">← Go to Website</a>
    </div>

    <div style="overflow-x: auto;">
        <table id="adminTable">
            <thead>
                <tr>
                    <th>Token (#ID)</th>
                    <th>Brand / Title</th>
                    <th>Slot Time & Date</th>
                    <th>Duration</th>
                    <th>Target URL</th>
                    <th>Media File</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="adminTableBody">
                <tr>
                    <td colspan="8" style="text-align: center; color: #9ca3af;">Loading records...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const SUPABASE_URL = 'https://swndqwcujyepctncxfhr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN3bmRxd2N1anllcGN0bmN4ZmhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMzczNDQsImV4cCI6MjEwNTkxMzM0NH0.FcoPIUbbpIfUzxLOxUhMXiTirW2-j5Fw5dnfl9tqx2o';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadAdminRecords() {
            const tbody = document.getElementById('adminTableBody');

            let { data, error } = await supabaseClient
                .from('buysecond_records')
                .select('*')
                .order('id', { ascending: true });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="8" style="color: #ef4444; text-align: center;">Error loading data: ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: #9ca3af;">No bookings found yet.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            data.forEach(record => {
                let statusClass = record.status === 'approved' ? 'status-approved' : 'status-pending';
                let fileUrl = record.file_url || record.video_url || '#';

                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>#${record.id}</b></td>
                    <td>${record.brand_name || 'N/A'}</td>
                    <td>${record.slot_time || 'N/A'}</td>
                    <td>${record.duration_second}s</td>
                    <td><a href="${record.target_url}" target="_blank" class="media-link">Visit Link</a></td>
                    <td><a href="${fileUrl}" target="_blank" class="media-link">View Media</a></td>
                    <td><span class="${statusClass}">${record.status || 'approved'}</span></td>
                    <td>
                        <button class="btn-action btn-delete" onclick="deleteRecord(${record.id})">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function deleteRecord(id) {
            if (!confirm(`Kya aap token #${id} ko delete karna chahte hain?`)) return;

            let { error } = await supabaseClient
                .from('buysecond_records')
                .delete()
                .eq('id', id);

            if (error) {
                alert('Delete karne mein error aayi: ' + error.message);
            } else {
                alert('Record successfully delete ho gaya!');
                loadAdminRecords();
            }
        }

        window.addEventListener('DOMContentLoaded', loadAdminRecords);
    </script>
</body>
</html>
