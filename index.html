<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MTB Crystal Cards & Exact 1 Lakh Square Grid Globe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #030712;
            overflow: hidden;
            font-family: sans-serif;
        }

        .shahi-void-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        .crystal-container {
            display: flex;
            gap: 15px;
            padding: 20px;
            z-index: 10;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .crystal-card {
            width: 90px;
            height: 130px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

            .crystal-card:hover {
                transform: scale(1.08);
            }

            .crystal-card img {
                width: 100%;
                height: 100%;
                object-fit: contain;
            }

        #canvas-globe-viewport {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* Live Counter Badge for Exact 1 Lakh Confirmation */
        .grid-counter-badge {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #00a8ff;
            background: rgba(3, 7, 18, 0.8);
            padding: 8px 16px;
            border: 1px solid rgba(0, 168, 255, 0.4);
            border-radius: 20px;
            font-size: 14px;
            z-index: 10;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="shahi-void-container">

        <!-- 💎 MAIN CRYSTAL LAYER -->
        <div class="crystal-container">
            <div class="crystal-card silver-spot" onclick="alert('VIP 75 CR: Wire Transfer Required.')">
                <img src="silver-card.png" alt="Silver Card">
            </div>
            <div class="crystal-card gold-spot" onclick="alert('VIP 100 CR: Wire Transfer Required.')">
                <img src="gold-card.png" alt="Gold Card">
            </div>
            <div class="crystal-card bronze-spot" onclick="alert('VIP 50 CR: Wire Transfer Required.')">
                <img src="bronze-card.png" alt="Bronze Card">
            </div>
        </div>

        <!-- 🗺️ Exact 1 Lakh Grid Globe Viewport -->
        <div id="canvas-globe-viewport">
            <canvas id="globeCanvas"></canvas>
        </div>

        <!-- Live Confirmation Badge -->
        <div class="grid-counter-badge">
            ⚡ ACTIVE GRID: <span id="gridCountDisplay">1,00,000</span> SQUARE CELLS
        </div>

    </div>

    <script>
                const canvas = document.getElementById('globeCanvas');
                const ctx = canvas.getContext('2d');

                let width = canvas.width = window.innerWidth;
                let height = canvas.height = window.innerHeight;

                const radius = Math.min(width, height) * 0.32;

                // 🌐 Exact 1 Lakh Grid Calculation (250 rows * 400 cols = 1,00,000 exact cells)
                const rows = 250;
                const cols = 400;

                console.log("=== MTB GLOBE VERIFICATION ===");
                console.log("Total Rows:", rows);
                console.log("Total Columns:", cols);
                console.log("Total Exact Square Grid Cells:", rows * cols);

                let angleY = 0.001;
                let angleX = 0;
                let zoomScale = 1;
                let isDragging = false;
                let previousMousePosition = { x: 0, y: 0 };

                function rotateAndProject(x, y, z) {
                    let cosY = Math.cos(angleY), sinY = Math.sin(angleY);
                    let x1 = x * cosY - z * sinY;
                    let z1 = x * sinY + z * cosY;

                    let cosX = Math.cos(angleX), sinX = Math.sin(angleX);
                    let y2 = y * cosX - z1 * sinX;
                    let z2 = y * sinX + z1 * cosX;

                    const fov = 600;
                    const scale = (fov / (fov + z2 * zoomScale)) * zoomScale;

                    return {
                        x: width / 2 + x1 * scale,
                        y: height / 2 + 50 + y2 * scale,
                        z: z2,
                        scale: scale
                    };
                }

                // Generate Exact 1 Lakh Grid Lines
                const gridLines = [];

                // Horizontal Rings (Latitudes)
                for (let r = 0; r <= rows; r++) {
                    const lat = -Math.PI / 2 + (r * Math.PI) / rows;
                    const ringPoints = [];
                    for (let c = 0; c <= cols; c++) {
                        const lon = -Math.PI + (c * 2 * Math.PI) / cols;
                        const x = radius * Math.cos(lat) * Math.cos(lon);
                        const y = radius * Math.sin(lat);
                        const z = radius * Math.cos(lat) * Math.sin(lon);
                        ringPoints.push({ x, y, z });
                    }
                    gridLines.push({ points: ringPoints });
                }

                // Vertical Arcs (Longitudes)
                for (let c = 0; c <= cols; c++) {
                    const lon = -Math.PI + (c * 2 * Math.PI) / cols;
                    const arcPoints = [];
                    for (let r = 0; r <= rows; r++) {
                        const lat = -Math.PI / 2 + (r * Math.PI) / rows;
                        const x = radius * Math.cos(lat) * Math.cos(lon);
                        const y = radius * Math.sin(lat);
                        const z = radius * Math.cos(lat) * Math.sin(lon);
                        arcPoints.push({ x, y, z });
                    }
                    gridLines.push({ points: arcPoints });
                }

                function drawLoop() {
                    ctx.clearRect(0, 0, width, height);

                    // 💡 Center Backlight Glow (Transparent center light)
                    const gradient = ctx.createRadialGradient(width / 2, height / 2 + 50, 0, width / 2, height / 2 + 50, radius * zoomScale * 1.1);
                    gradient.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
                    gradient.addColorStop(0.25, 'rgba(0, 168, 255, 0.35)');
                    gradient.addColorStop(0.7, 'rgba(6, 17, 41, 0.05)');
                    gradient.addColorStop(1, 'rgba(3, 7, 18, 0)');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, width, height);

                    ctx.lineWidth = 0.7;
                    ctx.strokeStyle = 'rgba(0, 180, 255, 0.5)';

                    // Render Exact Square Grid Lines
                    for (let line of gridLines) {
                        ctx.beginPath();
                        let pathStarted = false;

                        for (let pt of line.points) {
                            const p = rotateAndProject(pt.x, pt.y, pt.z);

                            if (p.z < 0) { // Front side visibility check
                                if (!pathStarted) {
                                    ctx.moveTo(p.x, p.y);
                                    pathStarted = true;
                                } else {
                                    ctx.lineTo(p.x, p.y);
                                }
                            } else {
                                pathStarted = false;
                            }
                        }
                        ctx.stroke();
                    }

                    if (!isDragging) {
                        angleY += 0.001;
                        angleX *= 0.95;
                    } else {
                        angleY = 0;
                        angleX = 0;
                    }

                    requestAnimationFrame(drawLoop);
                }

                // 🖱️ Google Map Style Drag & Zoom
                window.addEventListener('mousedown', () => { isDragging = true; });
                window.addEventListener('mouseup', () => { isDragging = false; });

                window.addEventListener('mousemove', (e) => {
                    if (!isDragging) {
                        previousMousePosition = { x: e.clientX, y: e.clientY };
                        return;
                    }
                    const deltaX = e.clientX - previousMousePosition.x;
                    const deltaY = e.clientY - previousMousePosition.y;

                    angleY += deltaX * 0.007;
                    angleX += deltaY * 0.007;

                    previousMousePosition = { x: e.clientX, y: e.clientY };
                });

                window.addEventListener('wheel', (e) => {
                    zoomScale -= e.deltaY * 0.001;
                    zoomScale = Math.max(0.5, Math.min(3.0, zoomScale));
                });

                // 📱 Mobile Touch Support
                window.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 1) {
                        isDragging = true;
                        previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                    }
                });
                window.addEventListener('touchmove', (e) => {
                    if (!isDragging || e.touches.length !== 1) return;
                    const deltaX = e.touches[0].clientX - previousMousePosition.x;
                    const deltaY = e.touches[0].clientY - previousMousePosition.y;

                    angleY += deltaX * 0.007;
                    angleX += deltaY * 0.007;

                    previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                });
                window.addEventListener('touchend', () => { isDragging = false; });

                window.addEventListener('resize', () => {
                    width = canvas.width = window.innerWidth;
                    height = canvas.height = window.innerHeight;
                });

                drawLoop();
    </script>
</body>
</html>
