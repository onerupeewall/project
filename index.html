<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MTB Crystal Cards & 1 Crore Square Pixel Grid Globe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #030712;
            overflow: hidden;
            font-family: sans-serif;
        }

        .shahi-void-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }
        /* 💎 Crystal Cards Container */
        .crystal-container {
            display: flex;
            gap: 15px;
            padding: 20px;
            z-index: 10;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .crystal-card {
            width: 90px;
            height: 130px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

            .crystal-card:hover {
                transform: scale(1.08);
            }

            .crystal-card img {
                width: 100%;
                height: 100%;
                object-fit: contain;
            }
        /* 🗺️ Globe Viewport */
        #canvas-globe-viewport {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="shahi-void-container">

        <!-- 💎 MAIN CRYSTAL LAYER (3 Crystal Cards) -->
        <div class="crystal-container">
            <div class="crystal-card silver-spot" onclick="alert('VIP 75 CR: Wire Transfer Required.')">
                <img src="silver-card.png" alt="Silver Card">
            </div>
            <div class="crystal-card gold-spot" onclick="alert('VIP 100 CR: Wire Transfer Required.')">
                <img src="gold-card.png" alt="Gold Card">
            </div>
            <div class="crystal-card bronze-spot" onclick="alert('VIP 50 CR: Wire Transfer Required.')">
                <img src="bronze-card.png" alt="Bronze Card">
            </div>
        </div>

        <!-- 🗺️ 1 Crore Square Pixel Grid Globe -->
        <div id="canvas-globe-viewport">
            <canvas id="globeCanvas"></canvas>
        </div>

    </div>

    <!-- ⚙️ 1 Crore Pixel Grid 3D Engine Script -->
    <script>
                const canvas = document.getElementById('globeCanvas');
                const ctx = canvas.getContext('2d');

                let width = canvas.width = window.innerWidth;
                let height = canvas.height = window.innerHeight;

                const points = [];
                const radius = Math.min(width, height) * 0.32;

                // 🌐 Exact 1 Crore Square Pixel Grid (2000 rows * 5000 cols = 1,00,00,000 pixels)
                const rows = 2000;
                const cols = 5000;

                console.log("Generating 1 Crore Pixel Grid... Please wait a moment.");
                for (let r = 0; r < rows; r++) {
                    const lat = (r / (rows - 1)) * Math.PI - Math.PI / 2;
                    for (let c = 0; c < cols; c++) {
                        const lon = (c / (cols - 1)) * 2 * Math.PI - Math.PI;

                        const x = radius * Math.cos(lat) * Math.cos(lon);
                        const y = radius * Math.sin(lat);
                        const z = radius * Math.cos(lat) * Math.sin(lon);

                        points.push({ x, y, z });
                    }
                }
                console.log("1 Crore Grid Generated Successfully!");

                let angleY = 0.001;
                let angleX = 0;
                let zoomScale = 1;
                let isDragging = false;
                let previousMousePosition = { x: 0, y: 0 };

                function project(point) {
                    let cosY = Math.cos(angleY), sinY = Math.sin(angleY);
                    let x1 = point.x * cosY - point.z * sinY;
                    let z1 = point.x * sinY + point.z * cosY;

                    let cosX = Math.cos(angleX), sinX = Math.sin(angleX);
                    let y2 = point.y * cosX - z1 * sinX;
                    let z2 = point.y * sinX + z1 * cosX;

                    point.x = x1; point.y = y2; point.z = z2;

                    const fov = 600;
                    const scale = (fov / (fov + z2 * zoomScale)) * zoomScale;

                    return {
                        x: width / 2 + x1 * scale,
                        y: height / 2 + 50 + y2 * scale,
                        visible: z2 < 0,
                        scale: scale
                    };
                }

                function drawLoop() {
                    ctx.clearRect(0, 0, width, height);

                    // 💡 Center Backlight Glow (Center Light for Brand Logos)
                    const gradient = ctx.createRadialGradient(width / 2, height / 2 + 50, 0, width / 2, height / 2 + 50, radius * zoomScale * 1.1);
                    gradient.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
                    gradient.addColorStop(0.2, 'rgba(0, 168, 255, 0.5)');
                    gradient.addColorStop(0.6, 'rgba(6, 17, 41, 0.2)');
                    gradient.addColorStop(1, 'rgba(3, 7, 18, 0)');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, width, height);

                    // ⬛ 1 Crore Square Pixel Grid Rendering (Microscopic & Dense)
                    ctx.fillStyle = 'rgba(0, 168, 255, 0.6)';
                    for (let i = 0; i < points.length; i++) {
                        const proj = project(points[i]);

                        if (proj.visible) {
                            const pSize = 1.2 * proj.scale; // Ekdum chote aur sharp square pixels
                            ctx.fillRect(proj.x - pSize / 2, proj.y - pSize / 2, pSize, pSize);
                        }
                    }

                    if (!isDragging) {
                        angleY = 0.001;
                        angleX *= 0.95;
                    } else {
                        angleY = 0;
                        angleX = 0;
                    }

                    requestAnimationFrame(drawLoop);
                }

                // 🖱️ Google Map Style Drag & Zoom
                window.addEventListener('mousedown', () => { isDragging = true; });
                window.addEventListener('mouseup', () => { isDragging = false; });

                window.addEventListener('mousemove', (e) => {
                    if (!isDragging) {
                        previousMousePosition = { x: e.clientX, y: e.clientY };
                        return;
                    }
                    const deltaX = e.clientX - previousMousePosition.x;
                    const deltaY = e.clientY - previousMousePosition.y;

                    angleY = deltaX * 0.007;
                    angleX = deltaY * 0.007;

                    previousMousePosition = { x: e.clientX, y: e.clientY };
                });

                window.addEventListener('wheel', (e) => {
                    zoomScale -= e.deltaY * 0.001;
                    zoomScale = Math.max(0.5, Math.min(3.0, zoomScale));
                });

                // 📱 Mobile Touch Support
                window.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 1) {
                        isDragging = true;
                        previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                    }
                });
                window.addEventListener('touchmove', (e) => {
                    if (!isDragging || e.touches.length !== 1) return;
                    const deltaX = e.touches[0].clientX - previousMousePosition.x;
                    const deltaY = e.touches[0].clientY - previousMousePosition.y;

                    angleY = deltaX * 0.007;
                    angleX = deltaY * 0.007;

                    previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                });
                window.addEventListener('touchend', () => { isDragging = false; });

                window.addEventListener('resize', () => {
                    width = canvas.width = window.innerWidth;
                    height = canvas.height = window.innerHeight;
                });

                drawLoop();
    </script>
</body>
</html>
