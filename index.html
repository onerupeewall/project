<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MTB Crystal Cards & Exact 1 Lakh Square Grid Globe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none; /* Prevent default mobile gestures like pinch-zoom page scroll */
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #030712;
            overflow: hidden;
            font-family: sans-serif;
        }

        .shahi-void-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        .crystal-container {
            display: flex;
            gap: 15px;
            padding: 15px;
            z-index: 10;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .crystal-card {
            width: 75px;
            height: 110px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

            .crystal-card:hover {
                transform: scale(1.08);
            }

            .crystal-card img {
                width: 100%;
                height: 100%;
                object-fit: contain;
            }

        #canvas-globe-viewport {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .grid-counter-badge {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #00a8ff;
            background: rgba(3, 7, 18, 0.85);
            padding: 6px 14px;
            border: 1px solid rgba(0, 168, 255, 0.4);
            border-radius: 20px;
            font-size: 12px;
            z-index: 10;
            letter-spacing: 1px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="shahi-void-container">

        <!-- 💎 MAIN CRYSTAL LAYER -->
        <div class="crystal-container">
            <div class="crystal-card silver-spot" onclick="alert('VIP 75 CR: Wire Transfer Required.')">
                <img src="silver-card.png" alt="Silver Card" onerror="this.style.border='1px dashed #00a8ff'">
            </div>
            <div class="crystal-card gold-spot" onclick="alert('VIP 100 CR: Wire Transfer Required.')">
                <img src="gold-card.png" alt="Gold Card" onerror="this.style.border='1px dashed #ffa500'">
            </div>
            <div class="crystal-card bronze-spot" onclick="alert('VIP 50 CR: Wire Transfer Required.')">
                <img src="bronze-card.png" alt="Bronze Card" onerror="this.style.border='1px dashed #ff4500'">
            </div>
        </div>

        <!-- 🗺️ Exact 1 Lakh Grid Globe Viewport -->
        <div id="canvas-globe-viewport">
            <canvas id="globeCanvas"></canvas>
        </div>

        <!-- Live Confirmation Badge -->
        <div class="grid-counter-badge">
            ⚡ 1,00,000 SQUARE CELLS
        </div>

    </div>

    <script>
                const canvas = document.getElementById('globeCanvas');
                const ctx = canvas.getContext('2d');

                let width = canvas.width = window.innerWidth;
                let height = canvas.height = window.innerHeight;

                const radius = Math.min(width, height) * 0.30;

                // 🌐 Exact 1 Lakh Grid Setup (250 rows * 400 cols = 1,00,000 cells)
                const rows = 250;
                const cols = 400;

                let angleY = 0.001;
                let angleX = 0;
                let zoomScale = 1;
                let isDragging = false;
                let previousMousePosition = { x: 0, y: 0 };
                let initialPinchDistance = null;

                function rotateAndProject(x, y, z) {
                    let cosY = Math.cos(angleY), sinY = Math.sin(angleY);
                    let x1 = x * cosY - z * sinY;
                    let z1 = x * sinY + z * cosY;

                    let cosX = Math.cos(angleX), sinX = Math.sin(angleX);
                    let y2 = y * cosX - z1 * sinX;
                    let z2 = y * sinX + z1 * cosX;

                    const fov = 600;
                    const scale = (fov / (fov + z2 * zoomScale)) * zoomScale;

                    return {
                        x: width / 2 + x1 * scale,
                        y: height / 2 + 40 + y2 * scale,
                        z: z2,
                        scale: scale
                    };
                }

                // Generate Exact 1 Lakh Grid Lines
                const gridLines = [];

                for (let r = 0; r <= rows; r++) {
                    const lat = -Math.PI / 2 + (r * Math.PI) / rows;
                    const ringPoints = [];
                    for (let c = 0; c <= cols; c++) {
                        const lon = -Math.PI + (c * 2 * Math.PI) / cols;
                        const x = radius * Math.cos(lat) * Math.cos(lon);
                        const y = radius * Math.sin(lat);
                        const z = radius * Math.cos(lat) * Math.sin(lon);
                        ringPoints.push({ x, y, z });
                    }
                    gridLines.push({ points: ringPoints });
                }

                for (let c = 0; c <= cols; c++) {
                    const lon = -Math.PI + (c * 2 * Math.PI) / cols;
                    const arcPoints = [];
                    for (let r = 0; r <= rows; r++) {
                        const lat = -Math.PI / 2 + (r * Math.PI) / rows;
                        const x = radius * Math.cos(lat) * Math.cos(lon);
                        const y = radius * Math.sin(lat);
                        const z = radius * Math.cos(lat) * Math.sin(lon);
                        arcPoints.push({ x, y, z });
                    }
                    gridLines.push({ points: arcPoints });
                }

                function drawLoop() {
                    ctx.clearRect(0, 0, width, height);

                    // 💡 Center Backlight Glow
                    const gradient = ctx.createRadialGradient(width / 2, height / 2 + 40, 0, width / 2, height / 2 + 40, radius * zoomScale * 1.1);
                    gradient.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
                    gradient.addColorStop(0.25, 'rgba(0, 168, 255, 0.35)');
                    gradient.addColorStop(0.7, 'rgba(6, 17, 41, 0.05)');
                    gradient.addColorStop(1, 'rgba(3, 7, 18, 0)');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, width, height);

                    ctx.lineWidth = 0.55;
                    ctx.strokeStyle = 'rgba(0, 180, 255, 0.55)';

                    // Render Exact Square Grid Lines
                    for (let line of gridLines) {
                        ctx.beginPath();
                        let pathStarted = false;

                        for (let pt of line.points) {
                            const p = rotateAndProject(pt.x, pt.y, pt.z);

                            if (p.z < 0) {
                                if (!pathStarted) {
                                    ctx.moveTo(p.x, p.y);
                                    pathStarted = true;
                                } else {
                                    ctx.lineTo(p.x, p.y);
                                }
                            } else {
                                pathStarted = false;
                            }
                        }
                        ctx.stroke();
                    }

                    if (!isDragging && initialPinchDistance === null) {
                        angleY += 0.001;
                        angleX *= 0.95;
                    }

                    requestAnimationFrame(drawLoop);
                }

                // 🖱️ Mouse Drag & Zoom
                window.addEventListener('mousedown', (e) => { isDragging = true; previousMousePosition = { x: e.clientX, y: e.clientY }; });
                window.addEventListener('mouseup', () => { isDragging = false; });

                window.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    const deltaX = e.clientX - previousMousePosition.x;
                    const deltaY = e.clientY - previousMousePosition.y;

                    angleY += deltaX * 0.007;
                    angleX += deltaY * 0.007;

                    previousMousePosition = { x: e.clientX, y: e.clientY };
                });

                window.addEventListener('wheel', (e) => {
                    zoomScale -= e.deltaY * 0.001;
                    zoomScale = Math.max(0.4, Math.min(3.5, zoomScale));
                });

                // 📱 Mobile Touch Support (Pinch-to-Zoom & Drag Rotation)
                window.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 1) {
                        isDragging = true;
                        previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                        initialPinchDistance = null;
                    } else if (e.touches.length === 2) {
                        isDragging = false;
                        initialPinchDistance = Math.hypot(
                            e.touches[0].clientX - e.touches[1].clientX,
                            e.touches[0].clientY - e.touches[1].clientY
                        );
                    }
                }, { passive: false });

                window.addEventListener('touchmove', (e) => {
                    if (e.touches.length === 1 && isDragging) {
                        const deltaX = e.touches[0].clientX - previousMousePosition.x;
                        const deltaY = e.touches[0].clientY - previousMousePosition.y;

                        angleY += deltaX * 0.007;
                        angleX += deltaY * 0.007;

                        previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                    } else if (e.touches.length === 2 && initialPinchDistance !== null) {
                        const currentPinchDistance = Math.hypot(
                            e.touches[0].clientX - e.touches[1].clientX,
                            e.touches[0].clientY - e.touches[1].clientY
                        );
                        const zoomFactor = currentPinchDistance / initialPinchDistance;
                        zoomScale *= zoomFactor;
                        zoomScale = Math.max(0.4, Math.min(3.5, zoomScale));
                        initialPinchDistance = currentPinchDistance;
                    }
                }, { passive: false });

                window.addEventListener('touchend', (e) => {
                    if (e.touches.length < 2) initialPinchDistance = null;
                    if (e.touches.length === 0) isDragging = false;
                });

                window.addEventListener('resize', () => {
                    width = canvas.width = window.innerWidth;
                    height = canvas.height = window.innerHeight;
                });

                drawLoop();
    </script>
</body>
</html>
