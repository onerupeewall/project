<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sharp Golden Text VIP Cards Globe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #01040d;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00f0ff;
            background: rgba(2, 8, 20, 0.85);
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid #00f0ff55;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .stat {
            font-size: 13px;
            margin: 4px 0;
            color: #88ccff;
        }

            .stat span {
                font-weight: bold;
                color: #00ffff;
            }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui-panel">
        <div style="font-weight: bold; color: #fff; margin-bottom: 5px;">VIP CARDS GLOBE</div>
        <div class="stat">Camera Distance: <span id="dist-val">0.0</span></div>
        <div class="stat">Status: <span id="status-val">Active</span></div>
    </div>

    <div id="canvas-container"></div>

    <script>
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();

            const INITIAL_CAM_POS = new THREE.Vector3(0, 0.5, 5.2);
            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.copy(INITIAL_CAM_POS);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 1.2;
            controls.maxDistance = 8;
            controls.enablePan = false;

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
            scene.add(ambientLight);

            const GLOBE_RADIUS = 1.0;

            // Dark Core
            const coreGeo = new THREE.SphereGeometry(GLOBE_RADIUS - 0.003, 64, 64);
            const coreMat = new THREE.MeshBasicMaterial({ color: 0x020714 });
            const coreMesh = new THREE.Mesh(coreGeo, coreMat);
            scene.add(coreMesh);

            const globeGroup = new THREE.Group();
            scene.add(globeGroup);

            // Glowing Golden Dot Texture
            function createGlowDotTexture() {
              const canvas = document.createElement('canvas');
              canvas.width = 128;
              canvas.height = 128;
              const ctx = canvas.getContext('2d');

              const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
              gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
              gradient.addColorStop(0.2, 'rgba(255, 215, 0, 1)');
              gradient.addColorStop(0.5, 'rgba(255, 165, 0, 0.8)');
              gradient.addColorStop(1, 'rgba(255, 140, 0, 0)');

              ctx.fillStyle = gradient;
              ctx.beginPath();
              ctx.arc(64, 64, 64, 0, Math.PI * 2);
              ctx.fill();

              return new THREE.CanvasTexture(canvas);
            }

            const goldGlowTexture = createGlowDotTexture();

            // Create Grid
            function createAlignedGridWithGoldenDots(radius, latDivisions, color, lineOpacity, pointSize, pointOpacity) {
              const lonDivisions = latDivisions * 2;
              const positions = [];
              const cornerPositions = [];

              for (let i = 1; i < latDivisions; i++) {
                const phi = (i / latDivisions) * Math.PI;
                const r = radius * Math.sin(phi);
                const y = radius * Math.cos(phi);

                for (let j = 0; j < lonDivisions; j++) {
                  const theta1 = (j / lonDivisions) * Math.PI * 2;
                  const theta2 = ((j + 1) / lonDivisions) * Math.PI * 2;

                  const x1 = r * Math.sin(theta1);
                  const z1 = r * Math.cos(theta1);
                  const x2 = r * Math.sin(theta2);
                  const z2 = r * Math.cos(theta2);

                  positions.push(x1, y, z1, x2, y, z2);
                  cornerPositions.push(x1, y, z1);
                }
              }

              for (let j = 0; j < lonDivisions; j++) {
                const theta = (j / lonDivisions) * Math.PI * 2;
                for (let i = 0; i < latDivisions; i++) {
                  const phi1 = (i / latDivisions) * Math.PI;
                  const phi2 = ((i + 1) / latDivisions) * Math.PI;

                  positions.push(
                    radius * Math.sin(phi1) * Math.sin(theta), radius * Math.cos(phi1), radius * Math.sin(phi1) * Math.cos(theta),
                    radius * Math.sin(phi2) * Math.sin(theta), radius * Math.cos(phi2), radius * Math.sin(phi2) * Math.cos(theta)
                  );
                }
              }

              const lineGeometry = new THREE.BufferGeometry();
              lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
              const lineMaterial = new THREE.LineBasicMaterial({
                color: color,
                transparent: true,
                opacity: lineOpacity
              });
              const lines = new THREE.LineSegments(lineGeometry, lineMaterial);

              const pointGeometry = new THREE.BufferGeometry();
              pointGeometry.setAttribute('position', new THREE.Float32BufferAttribute(cornerPositions, 3));

              const pointMaterial = new THREE.PointsMaterial({
                map: goldGlowTexture,
                size: pointSize,
                transparent: true,
                opacity: pointOpacity,
                blending: THREE.AdditiveBlending,
                depthWrite: false
              });

              const points = new THREE.Points(pointGeometry, pointMaterial);

              const gridGroup = new THREE.Group();
              gridGroup.add(lines);
              gridGroup.add(points);

              return { group: gridGroup, lineMat: lineMaterial, pointMat: pointMaterial };
            }

            const layer1 = createAlignedGridWithGoldenDots(GLOBE_RADIUS, 24, 0x00f0ff, 0.95, 0.045, 1.0);
            const layer2 = createAlignedGridWithGoldenDots(GLOBE_RADIUS + 0.001, 48, 0x00b4ff, 0.0, 0.035, 0.0);
            const layer3 = createAlignedGridWithGoldenDots(GLOBE_RADIUS + 0.002, 96, 0x33eaff, 0.0, 0.025, 0.0);

            globeGroup.add(layer1.group);
            globeGroup.add(layer2.group);
            globeGroup.add(layer3.group);

            // --- ULTRA SHARP GLOWING GOLD TEXTURE GENERATOR ---
            function createVIPCardTexture(textValue) {
              const canvas = document.createElement('canvas');
              canvas.width = 1024;
              canvas.height = 1536;
              const ctx = canvas.getContext('2d');

              // Glassy Dark Blue Card Background
              const bgGrad = ctx.createLinearGradient(0, 0, 1024, 1536);
              bgGrad.addColorStop(0, 'rgba(2, 12, 24, 0.96)');
              bgGrad.addColorStop(0.5, 'rgba(1, 6, 14, 0.98)');
              bgGrad.addColorStop(1, 'rgba(2, 16, 32, 0.96)');
              ctx.fillStyle = bgGrad;
              ctx.fillRect(0, 0, 1024, 1536);

              // Cyan Borders (Matching Globe Accent)
              ctx.strokeStyle = '#00f0ff';
              ctx.lineWidth = 22;
              ctx.strokeRect(30, 30, 964, 1476);

              ctx.strokeStyle = '#33eaff';
              ctx.lineWidth = 8;
              ctx.strokeRect(60, 60, 904, 1416);

              ctx.textAlign = 'center';

              // Top Title
              ctx.font = '900 64px Arial';
              ctx.fillStyle = '#00f0ff';
              ctx.shadowColor = '#00f0ff';
              ctx.shadowBlur = 25;
              ctx.fillText('EXCLUSIVE ACCESS', 512, 250);

              // --- HIGH GLOSS GOLD TEXT GRADIENT ---
              const goldGrad = ctx.createLinearGradient(0, 650, 0, 850);
              goldGrad.addColorStop(0.0, '#FFFFFF'); // Bright top shimmer
              goldGrad.addColorStop(0.2, '#FFF2A3'); // Soft gold
              goldGrad.addColorStop(0.5, '#FFD700'); // Pure Gold
              goldGrad.addColorStop(0.8, '#D4AF37'); // Metallic Gold
              goldGrad.addColorStop(1.0, '#996515'); // Deep Amber base

              ctx.font = '900 110px Arial';

              // Glow Aura
              ctx.shadowColor = '#FFD700';
              ctx.shadowBlur = 50;
              ctx.fillStyle = goldGrad;
              ctx.fillText(textValue, 512, 780);

              // Crisp Foreground Text
              ctx.shadowColor = '#FFA500';
              ctx.shadowBlur = 10;
              ctx.strokeStyle = '#221400';
              ctx.lineWidth = 6;
              ctx.strokeText(textValue, 512, 780);
              ctx.fillText(textValue, 512, 780);

              // Reset Glow for Bottom Badge
              ctx.shadowBlur = 0;

              // Bottom VIP Badge
              ctx.font = '900 75px Arial';
              ctx.fillStyle = '#00f0ff';
              ctx.shadowColor = '#00f0ff';
              ctx.shadowBlur = 20;
              ctx.fillText('★ GOLDEN PASS ★', 512, 1300);

              const texture = new THREE.CanvasTexture(canvas);
              texture.anisotropy = 16;
              return texture;
            }

            // --- 3D VIP CARDS CREATION ---
            const cardsGroup = new THREE.Group();
            scene.add(cardsGroup);

            const cardGeo = new THREE.BoxGeometry(0.8, 1.2, 0.02);

            function createVIPCardMesh(textValue, posX, posY, posZ) {
              const texture = createVIPCardTexture(textValue);

              const cardMat = new THREE.MeshBasicMaterial({
                map: texture,
                transparent: true,
                opacity: 0.98,
                side: THREE.DoubleSide
              });

              const cardMesh = new THREE.Mesh(cardGeo, cardMat);
              cardMesh.position.set(posX, posY, posZ);

              // Cyan Outer Wireframe Edges
              const edgesGeo = new THREE.EdgesGeometry(cardGeo);
              const edgesMat = new THREE.LineBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 1.0 });
              const edgeLines = new THREE.LineSegments(edgesGeo, edgesMat);
              cardMesh.add(edgeLines);

              return cardMesh;
            }

            const card75cr  = createVIPCardMesh("75cr VIP CARD", -1.05, 1.8, 0);
            const card100cr = createVIPCardMesh("100cr VIP CARD", 0.0,  1.95, 0.15);
            const card50cr  = createVIPCardMesh("50cr VIP CARD",  1.05, 1.8, 0);

            cardsGroup.add(card75cr);
            cardsGroup.add(card100cr);
            cardsGroup.add(card50cr);

            // --- INTERACTION & 5s RESET LOGIC ---
            let isUserInteracting = false;
            let resetTimer = null;
            let autoRotate = true;

            function onInteractionStart() {
              isUserInteracting = true;
              autoRotate = false;
              document.getElementById('status-val').innerText = "Interaction Active (Paused)";
              if (resetTimer) clearTimeout(resetTimer);
            }

            function onInteractionEnd() {
              isUserInteracting = false;
              if (resetTimer) clearTimeout(resetTimer);

              resetTimer = setTimeout(() => {
                document.getElementById('status-val').innerText = "Resetting Position...";
              }, 5000);
            }

            controls.addEventListener('start', onInteractionStart);
            controls.addEventListener('end', onInteractionEnd);

            window.addEventListener('touchstart', onInteractionStart, { passive: true });
            window.addEventListener('touchend', onInteractionEnd, { passive: true });
            window.addEventListener('mousedown', onInteractionStart);
            window.addEventListener('mouseup', onInteractionEnd);

            const distEl = document.getElementById('dist-val');
            const statusEl = document.getElementById('status-val');
            let clock = new THREE.Clock();

            function animate() {
              requestAnimationFrame(animate);

              const elapsedTime = clock.getElapsedTime();

              if (autoRotate && !isUserInteracting) {
                globeGroup.rotation.y += 0.0008;
              }

              card75cr.position.y  = 1.80 + Math.sin(elapsedTime * 1.5) * 0.03;
              card100cr.position.y = 1.95 + Math.sin(elapsedTime * 1.5 + 0.8) * 0.04;
              card50cr.position.y  = 1.80 + Math.sin(elapsedTime * 1.5 + 1.6) * 0.03;

              if (!isUserInteracting && statusEl.innerText === "Resetting Position...") {
                camera.position.lerp(INITIAL_CAM_POS, 0.05);
                globeGroup.rotation.x *= 0.95;
                globeGroup.rotation.z *= 0.95;

                if (camera.position.distanceTo(INITIAL_CAM_POS) < 0.02) {
                  autoRotate = true;
                  statusEl.innerText = "Active (Auto-Rotating)";
                }
              }

              controls.update();

              const distance = camera.position.distanceTo(globeGroup.position) - GLOBE_RADIUS;
              distEl.innerText = distance.toFixed(2);

              if (distance < 2.2) {
                const op = Math.min(0.9, (2.2 - distance) / 1.0);
                layer2.lineMat.opacity = op;
                layer2.pointMat.opacity = op;
              } else {
                layer2.lineMat.opacity = 0;
                layer2.pointMat.opacity = 0;
              }

              if (distance < 1.0) {
                const op = Math.min(0.85, (1.0 - distance) / 0.5);
                layer3.lineMat.opacity = op;
                layer3.pointMat.opacity = op;
              } else {
                layer3.lineMat.opacity = 0;
                layer3.pointMat.opacity = 0;
              }

              renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
              camera.aspect = window.innerWidth / window.innerHeight;
              camera.updateProjectionMatrix();
              renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
    </script>
</body>
</html>
