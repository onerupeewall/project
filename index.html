<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Clean Pixel-Aligned Grid Globe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #01040d;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00f0ff;
            background: rgba(2, 8, 20, 0.85);
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid #00f0ff55;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .stat {
            font-size: 13px;
            margin: 2px 0;
            color: #88ccff;
        }

            .stat span {
                font-weight: bold;
                color: #00ffff;
            }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui-panel">
        <div style="font-weight: bold; color: #fff; margin-bottom: 2px;">3D GLOBE</div>
        <div class="stat">Status: <span id="status-val">Active</span></div>
    </div>

    <div id="canvas-container"></div>

    <script>
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();

            const INITIAL_CAM_POS = new THREE.Vector3(0, 0, 6.45);
            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.001, 1000);
            camera.position.copy(INITIAL_CAM_POS);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, logarithmicDepthBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            controls.enableZoom = true;
            controls.zoomSpeed = 0.6;
            controls.minDistance = 1.01;
            controls.maxDistance = 15.0;

            controls.enablePan = true;
            controls.screenSpacePanning = true;

            const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
            scene.add(ambientLight);

            const GLOBE_RADIUS = 1.0;

            // Dark Inner Core
            const coreGeo = new THREE.SphereGeometry(GLOBE_RADIUS - 0.001, 64, 64);
            const coreMat = new THREE.MeshBasicMaterial({ color: 0x020714 });
            const coreMesh = new THREE.Mesh(coreGeo, coreMat);
            scene.add(coreMesh);

            const globeGroup = new THREE.Group();
            scene.add(globeGroup);

            // Exact Multipliers for Binary Grid Sub-division (24 -> 48 -> 96 -> 192 -> 384)
            const BASE_DIVISIONS = 24;
            const MULTIPLIERS = [1, 2, 4, 8, 16];
            const layers = [];

            MULTIPLIERS.forEach((mult) => {
              const latDivs = BASE_DIVISIONS * mult;
              const lonDivs = latDivs * 2;
              const positions = [];

              // Latitude lines (Horizontal circles)
              for (let i = 1; i < latDivs; i++) {
                const phi = (i / latDivs) * Math.PI;
                const r = GLOBE_RADIUS * Math.sin(phi);
                const y = GLOBE_RADIUS * Math.cos(phi);

                for (let j = 0; j < lonDivs; j++) {
                  const theta1 = (j / lonDivs) * Math.PI * 2;
                  const theta2 = ((j + 1) / lonDivs) * Math.PI * 2;

                  positions.push(
                    r * Math.sin(theta1), y, r * Math.cos(theta1),
                    r * Math.sin(theta2), y, r * Math.cos(theta2)
                  );
                }
              }

              // Longitude lines (Vertical meridian arcs)
              for (let j = 0; j < lonDivs; j++) {
                const theta = (j / lonDivs) * Math.PI * 2;
                for (let i = 0; i < latDivs; i++) {
                  const phi1 = (i / latDivs) * Math.PI;
                  const phi2 = ((i + 1) / latDivs) * Math.PI;

                  positions.push(
                    GLOBE_RADIUS * Math.sin(phi1) * Math.sin(theta), GLOBE_RADIUS * Math.cos(phi1), GLOBE_RADIUS * Math.sin(phi1) * Math.cos(theta),
                    GLOBE_RADIUS * Math.sin(phi2) * Math.sin(theta), GLOBE_RADIUS * Math.cos(phi2), GLOBE_RADIUS * Math.sin(phi2) * Math.cos(theta)
                  );
                }
              }

              const lineGeometry = new THREE.BufferGeometry();
              lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
              const lineMaterial = new THREE.LineBasicMaterial({
                color: 0x00f0ff,
                transparent: true,
                opacity: 0.0
              });
              const lines = new THREE.LineSegments(lineGeometry, lineMaterial);

              globeGroup.add(lines);
              layers.push(lineMaterial);
            });

            let isUserInteracting = false;
            let resetTimer = null;
            let autoRotate = true;

            function onInteractionStart() {
              isUserInteracting = true;
              autoRotate = false;
              document.getElementById('status-val').innerText = "Active";
              if (resetTimer) clearTimeout(resetTimer);
            }

            function onInteractionEnd() {
              isUserInteracting = false;
              if (resetTimer) clearTimeout(resetTimer);

              resetTimer = setTimeout(() => {
                document.getElementById('status-val').innerText = "Resetting...";
              }, 5000);
            }

            controls.addEventListener('start', onInteractionStart);
            controls.addEventListener('end', onInteractionEnd);

            window.addEventListener('touchstart', onInteractionStart, { passive: true });
            window.addEventListener('touchend', onInteractionEnd, { passive: true });
            window.addEventListener('mousedown', onInteractionStart);
            window.addEventListener('mouseup', onInteractionEnd);

            const statusEl = document.getElementById('status-val');

            function animate() {
              requestAnimationFrame(animate);

              if (autoRotate && !isUserInteracting) {
                globeGroup.rotation.y += 0.0008;
              }

              if (!isUserInteracting && statusEl.innerText === "Resetting...") {
                camera.position.lerp(INITIAL_CAM_POS, 0.05);
                controls.target.lerp(new THREE.Vector3(0, 0, 0), 0.05);
                globeGroup.rotation.x *= 0.95;
                globeGroup.rotation.z *= 0.95;

                if (camera.position.distanceTo(INITIAL_CAM_POS) < 0.02) {
                  autoRotate = true;
                  statusEl.innerText = "Active (Auto-Rotating)";
                }
              }

              const distance = camera.position.distanceTo(globeGroup.position);

              const speedScale = Math.max(0.015, (distance / 6.45));
              controls.rotateSpeed = 0.25 * speedScale;
              controls.panSpeed = 0.04 * speedScale;

              controls.update();

              // Sharp & Clean LOD Cross-Fading (No line overlapping)
              if (distance >= 4.8) {
                setOpacities([0.9, 0, 0, 0, 0]);
              } else if (distance < 4.8 && distance >= 3.2) {
                let t = (4.8 - distance) / 1.6;
                setOpacities([0.9 * (1 - t), 0.9 * t, 0, 0, 0]);
              } else if (distance < 3.2 && distance >= 2.0) {
                let t = (3.2 - distance) / 1.2;
                setOpacities([0, 0.9 * (1 - t), 0.9 * t, 0, 0]);
              } else if (distance < 2.0 && distance >= 1.3) {
                let t = (2.0 - distance) / 0.7;
                setOpacities([0, 0, 0.9 * (1 - t), 0.9 * t, 0]);
              } else {
                let t = Math.min(1.0, (1.3 - distance) / 0.28);
                setOpacities([0, 0, 0, 0.9 * (1 - t), 0.9 * t]);
              }

              renderer.render(scene, camera);
            }

            function setOpacities(opArray) {
              for (let i = 0; i < layers.length; i++) {
                layers[i].opacity = opArray[i];
              }
            }

            window.addEventListener('resize', () => {
              camera.aspect = window.innerWidth / window.innerHeight;
              camera.updateProjectionMatrix();
              renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
    </script>
</body>
</html>
