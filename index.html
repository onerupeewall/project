<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Crystal Cards</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #150f2c 0%, #05030a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* यहाँ गैप कम कर दिया है ताकि कार्ड्स पास-पास आ जाएं */
        .crystal-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .crystal-card {
            width: 210px;
            height: 310px;
            cursor: pointer;
            transition: transform 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

            .crystal-card img {
                width: 100%;
                height: 100%;
                object-fit: contain;
                filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.8));
            }

        /* बीच वाला गोल्ड कार्ड थोड़ा बड़ा और आकर्षक दिखेगा */
        .gold-spot {
            transform: scale(1.12);
            z-index: 2; /* ताकि ये साइड वाले कार्ड के ऊपर हल्का सा ओवरलैप हो सके */
        }

        .crystal-card:hover {
            transform: translateY(-8px) scale(1.05);
        }

        .gold-spot:hover {
            transform: translateY(-8px) scale(1.18);
        }
    </style>
</head>
<body>

    <div class="crystal-container">

        <!-- सिल्वर कार्ड -->
        <div class="crystal-card">
            <img src="silver-card.png.png" alt="Silver Card">
        </div>

        <!-- गोल्ड कार्ड (बीच वाला) -->
        <div class="crystal-card gold-spot">
            <img src="gold-card.png.png" alt="Gold Card">
        </div>

        <!-- ब्रॉन्ज कार्ड -->
        <div class="crystal-card">
            <img src="bronze-card.png.png" alt="Bronze Card">
        </div>

    </div>

</body>
</html>
