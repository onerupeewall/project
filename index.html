<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Dots Globe with 3D Crystal Cards</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #01040d;
            font-family: Arial, sans-serif;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
        }

        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00f0ff;
            background: rgba(2, 8, 20, 0.85);
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid #00f0ff55;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .stat {
            font-size: 13px;
            margin: 4px 0;
            color: #88ccff;
        }

            .stat span {
                font-weight: bold;
                color: #00ffff;
            }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui-panel">
        <div style="font-weight: bold; color: #fff; margin-bottom: 5px;">CRYSTAL CARDS GLOBE</div>
        <div class="stat">Camera Distance: <span id="dist-val">0.0</span></div>
        <div class="stat">Active Layer: <span id="layer-val">Level 1 (Golden Dots Grid)</span></div>
    </div>

    <div id="canvas-container"></div>

    <script>
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();

            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0.5, 4.5);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 1.05;
            controls.maxDistance = 8;

            // Lighting setup for 3D Crystal Mesh
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionalLight(0x00f0ff, 1.2);
            dirLight1.position.set(5, 5, 5);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0xffd700, 1.0);
            dirLight2.position.set(-5, 5, -5);
            scene.add(dirLight2);

            const GLOBE_RADIUS = 1.0;

            // Dark Core Sphere
            const coreGeo = new THREE.SphereGeometry(GLOBE_RADIUS - 0.003, 64, 64);
            const coreMat = new THREE.MeshBasicMaterial({ color: 0x020714 });
            const coreMesh = new THREE.Mesh(coreGeo, coreMat);
            scene.add(coreMesh);

            const globeGroup = new THREE.Group();
            scene.add(globeGroup);

            // Glowing Golden Dot Texture
            function createGlowDotTexture() {
              const canvas = document.createElement('canvas');
              canvas.width = 128;
              canvas.height = 128;
              const ctx = canvas.getContext('2d');

              const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
              gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
              gradient.addColorStop(0.2, 'rgba(255, 215, 0, 1)');
              gradient.addColorStop(0.5, 'rgba(255, 165, 0, 0.8)');
              gradient.addColorStop(1, 'rgba(255, 140, 0, 0)');

              ctx.fillStyle = gradient;
              ctx.beginPath();
              ctx.arc(64, 64, 64, 0, Math.PI * 2);
              ctx.fill();

              return new THREE.CanvasTexture(canvas);
            }

            const goldGlowTexture = createGlowDotTexture();

            // Create Grid with Golden Glow Dots
            function createAlignedGridWithGoldenDots(radius, latDivisions, color, lineOpacity, pointSize, pointOpacity) {
              const lonDivisions = latDivisions * 2;
              const positions = [];
              const cornerPositions = [];

              for (let i = 1; i < latDivisions; i++) {
                const phi = (i / latDivisions) * Math.PI;
                const r = radius * Math.sin(phi);
                const y = radius * Math.cos(phi);

                for (let j = 0; j < lonDivisions; j++) {
                  const theta1 = (j / lonDivisions) * Math.PI * 2;
                  const theta2 = ((j + 1) / lonDivisions) * Math.PI * 2;

                  const x1 = r * Math.sin(theta1);
                  const z1 = r * Math.cos(theta1);
                  const x2 = r * Math.sin(theta2);
                  const z2 = r * Math.cos(theta2);

                  positions.push(x1, y, z1, x2, y, z2);
                  cornerPositions.push(x1, y, z1);
                }
              }

              for (let j = 0; j < lonDivisions; j++) {
                const theta = (j / lonDivisions) * Math.PI * 2;
                for (let i = 0; i < latDivisions; i++) {
                  const phi1 = (i / latDivisions) * Math.PI;
                  const phi2 = ((i + 1) / latDivisions) * Math.PI;

                  positions.push(
                    radius * Math.sin(phi1) * Math.sin(theta), radius * Math.cos(phi1), radius * Math.sin(phi1) * Math.cos(theta),
                    radius * Math.sin(phi2) * Math.sin(theta), radius * Math.cos(phi2), radius * Math.sin(phi2) * Math.cos(theta)
                  );
                }
              }

              const lineGeometry = new THREE.BufferGeometry();
              lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
              const lineMaterial = new THREE.LineBasicMaterial({
                color: color,
                transparent: true,
                opacity: lineOpacity
              });
              const lines = new THREE.LineSegments(lineGeometry, lineMaterial);

              const pointGeometry = new THREE.BufferGeometry();
              pointGeometry.setAttribute('position', new THREE.Float32BufferAttribute(cornerPositions, 3));

              const pointMaterial = new THREE.PointsMaterial({
                map: goldGlowTexture,
                size: pointSize,
                transparent: true,
                opacity: pointOpacity,
                blending: THREE.AdditiveBlending,
                depthWrite: false
              });

              const points = new THREE.Points(pointGeometry, pointMaterial);

              const gridGroup = new THREE.Group();
              gridGroup.add(lines);
              gridGroup.add(points);

              return { group: gridGroup, lineMat: lineMaterial, pointMat: pointMaterial };
            }

            const layer1 = createAlignedGridWithGoldenDots(GLOBE_RADIUS, 24, 0x00f0ff, 0.95, 0.045, 1.0);
            const layer2 = createAlignedGridWithGoldenDots(GLOBE_RADIUS + 0.001, 48, 0x00b4ff, 0.0, 0.035, 0.0);
            const layer3 = createAlignedGridWithGoldenDots(GLOBE_RADIUS + 0.002, 96, 0x33eaff, 0.0, 0.025, 0.0);

            globeGroup.add(layer1.group);
            globeGroup.add(layer2.group);
            globeGroup.add(layer3.group);

            // --- 3D CRYSTAL CARDS CREATION ---
            const textureLoader = new THREE.TextureLoader();
            const cardsGroup = new THREE.Group();
            scene.add(cardsGroup);

            // Card Box Geometry with rounded depth thickness
            const cardGeo = new THREE.BoxGeometry(0.38, 0.56, 0.015);

            function createCrystalCard(texturePath, posX, posY, posZ) {
              const texture = textureLoader.load(texturePath);

              // Glass Crystal Material with Reflection & Opacity
              const cardMat = new THREE.MeshPhysicalMaterial({
                map: texture,
                transparent: true,
                opacity: 0.9,
                roughness: 0.1,
                metalness: 0.1,
                transmission: 0.2, // Crystal Glass effect
                thickness: 0.5,
                clearcoat: 1.0,
                clearcoatRoughness: 0.1,
                reflectivity: 0.9
              });

              const cardMesh = new THREE.Mesh(cardGeo, cardMat);
              cardMesh.position.set(posX, posY, posZ);

              // Subtle Outer Glowing Edge Frame
              const edgesGeo = new THREE.EdgesGeometry(cardGeo);
              const edgesMat = new THREE.LineBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.6 });
              const edgeLines = new THREE.LineSegments(edgesGeo, edgesMat);
              cardMesh.add(edgeLines);

              return cardMesh;
            }

            // Positions for 3 Cards right above the Globe
            const cardSilver = createCrystalCard('silver.card.png', -0.5, 1.45, 0);
            const cardGold   = createCrystalCard('gold.card.png',    0.0, 1.55, 0.1);
            const cardBronze = createCrystalCard('bronze.card.png',  0.5, 1.45, 0);

            cardsGroup.add(cardSilver);
            cardsGroup.add(cardGold);
            cardsGroup.add(cardBronze);

            const distEl = document.getElementById('dist-val');
            const layerEl = document.getElementById('layer-val');

            let clock = new THREE.Clock();

            function animate() {
              requestAnimationFrame(animate);

              const elapsedTime = clock.getElapsedTime();

              // Continuous Slow Globe Rotation
              globeGroup.rotation.y += 0.0008;

              // Floating 3D Crystal Card Animation
              cardSilver.position.y = 1.45 + Math.sin(elapsedTime * 1.5) * 0.03;
              cardGold.position.y   = 1.55 + Math.sin(elapsedTime * 1.5 + 0.8) * 0.04;
              cardBronze.position.y = 1.45 + Math.sin(elapsedTime * 1.5 + 1.6) * 0.03;

              cardSilver.rotation.y = Math.sin(elapsedTime * 0.8) * 0.12 - 0.1;
              cardGold.rotation.y   = Math.sin(elapsedTime * 0.8 + 0.5) * 0.15;
              cardBronze.rotation.y = Math.sin(elapsedTime * 0.8 + 1.0) * 0.12 + 0.1;

              controls.update();

              const distance = camera.position.distanceTo(globeGroup.position) - GLOBE_RADIUS;
              distEl.innerText = distance.toFixed(2);

              // Controlled Zoom Opacity Transitions
              if (distance < 2.0) {
                const op = Math.min(0.9, (2.0 - distance) / 1.0);
                layer2.lineMat.opacity = op;
                layer2.pointMat.opacity = op;
              } else {
                layer2.lineMat.opacity = 0;
                layer2.pointMat.opacity = 0;
              }

              if (distance < 0.8) {
                const op = Math.min(0.85, (0.8 - distance) / 0.4);
                layer3.lineMat.opacity = op;
                layer3.pointMat.opacity = op;
              } else {
                layer3.lineMat.opacity = 0;
                layer3.pointMat.opacity = 0;
              }

              // UI Update
              if (distance > 2.0) {
                layerEl.innerText = "Level 1 (Golden Dots Grid)";
              } else if (distance > 0.8) {
                layerEl.innerText = "Level 2 (2x Sub-Grid + Golden Dots)";
              } else {
                layerEl.innerText = "Level 3 (4x Micro-Grid + Golden Dots)";
              }

              renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
              camera.aspect = window.innerWidth / window.innerHeight;
              camera.updateProjectionMatrix();
              renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
    </script>
</body>
</html>
